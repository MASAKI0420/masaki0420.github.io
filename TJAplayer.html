<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- PWA設定 -->
    <meta name="theme-color" content="#1f2940">
    <link rel="manifest" href="manifest.json">
    <title>Taiko Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* --- Global Styles --- */
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #0d0d1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            color: white;
        }

        .game-wrapper {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #taiko-wrapper #taiko-game-container.playing {
            cursor: none;
        }

        /* --- osu!taiko Styles (Scoped) --- */
        #taiko-wrapper {
            --panel-bg: #1f2940;
            --panel-text: #e0e5f0;
            --panel-border: #4a5578;
            --accent-color: #d9534f;
            --disabled-color: #555c6f;
            --ui-offset-x: 0px;
            --lane-scale: 1.4; /* 太鼓・ゲージ・コンボ等の拡大倍率 */
            --lane-h: 195px; /* レーン本体の高さ（音符・判定円の大きさとは独立） */
            --lane-up: 95px; /* レーン全体を上へ上げる量 */
            --lane-shift: calc((180px * var(--lane-scale) - var(--lane-h)) / 2 - var(--lane-up)); /* レーンの高さ変更と上げた分、上辺に付くパーツを動かす量 */
        }
        #taiko-wrapper #taiko-background-video {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: contain; /* 動画の比率を保ったまま画面内に収める（拡大しない） */
        }
        #taiko-wrapper #taiko-background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: contain; 
            image-rendering: auto;
            backface-visibility: hidden;
        }

        #taiko-wrapper #app-container { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        #taiko-wrapper #controls-panel {
            width: 1200px;
            min-height: 1150px;
            font-size: 14px;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            color: var(--panel-text);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr auto auto;
            gap: 10px 20px;
            align-items: start;
            transform: scale(0.85);
            box-sizing: border-box;
        }
        #taiko-wrapper .panel-column-left, #taiko-wrapper .panel-column-right {
            display: flex;
            flex-direction: column;
            gap: 50px;
            min-height: 200px;
            align-self: stretch;           /* 縦に伸ばした分は、各項目の間に均等に配分する */
            justify-content: space-between;
        }
        #taiko-wrapper .panel-column-left { grid-column: 1; grid-row: 2; }
        #taiko-wrapper .panel-column-right { grid-column: 2; grid-row: 2; }

        #taiko-wrapper .control-group { display: flex; flex-direction: column; gap: 8px; }

        #taiko-wrapper #beatmap-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
         #taiko-wrapper #beatmap-actions > * {
            width: 100%;
            padding: 10px 0;
            font-size: 0.9em;
        }
        #taiko-wrapper #delete-song-button { background-color: #8c3b38; }
        #taiko-wrapper #delete-song-button:hover { background-color: #a34c49; }

        #taiko-wrapper .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 15px;
            align-items: start;
        }
        #taiko-wrapper .settings-grid .control-group { gap: 8px; }
        #taiko-wrapper .settings-grid .control-group.span-2 { grid-column: 1 / -1; }
        #taiko-wrapper .assist-options { display: flex; flex-direction: column; gap: 5px; }
        #taiko-wrapper .sound-options { display: grid; grid-template-columns: 1fr 1fr 50px; gap: 8px; align-items: center; }
        #taiko-wrapper .sound-options .file-input-label { flex: 1; }
        #taiko-wrapper #don-sound-reset, #taiko-wrapper #katsu-sound-reset { padding: 8px 10px; font-size: 0.8em; background-color: #555c6f; }

        #taiko-wrapper #taiko-game-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; display: none; z-index: 10; }
        
        #taiko-wrapper #taiko-playfield { position: absolute; top: 50%; left: 0; right: 0; height: var(--lane-h); transform: translateY(calc(-50% - 58px - var(--lane-up))); background-color: rgba(255, 255, 255, 0.36); border-top: 4px solid #000; border-bottom: 6px solid #000; z-index: 10; box-shadow: 0 5px 25px rgba(0,0,0,0.3); border-radius: 0; }
        #taiko-wrapper #game-canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 1; }
        /* 譜面分岐：レール(レーン)の背景に分岐ごとの画像を敷く。画像は縦横比を保って右端に置き、左側は同じ色で埋める */
        #taiko-wrapper #branch-lane-bg { position: absolute; inset: 0; pointer-events: none; background-repeat: no-repeat; background-position: right center; background-size: auto 100%; }
        #taiko-wrapper .grid-item-full { grid-column: 1 / -1; }
        #taiko-wrapper #controls-panel h2 { grid-column: 1 / -1; text-align: center; margin: 0 0 10px 0; font-size: 1.8em; font-weight: 600; color: var(--accent-color); }
        #taiko-wrapper #controls-panel label { font-size: 0.9em; font-weight: 500; color: #a0a8c0; margin-bottom: 0px; display: block; }
        #taiko-wrapper #controls-panel p { grid-column: 1 / -1; text-align: center; margin: 10px 0 0 0; }
        #taiko-wrapper input[type="file"] { width: 0.1px; height: 0.1px; opacity: 0; overflow: hidden; position: absolute; z-index: -1; }
        #taiko-wrapper .file-input-label { display: inline-block; padding: 8px 15px; font-size: 0.9em; font-weight: 500; color: var(--panel-text); background-color: #394362; border: 1px solid var(--panel-border); border-radius: 6px; cursor: pointer; transition: background-color 0.2s; text-align: center;}
        #taiko-wrapper .file-input-label:hover { background-color: #4a5578; }
        #taiko-wrapper .file-input-label.is-loading { background-color: var(--disabled-color); cursor: not-allowed; }
        #taiko-wrapper input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: #2a344d; border-radius: 3px; outline: none; cursor: pointer; }
        #taiko-wrapper input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: var(--accent-color); border-radius: 50%; cursor: pointer; }
        #taiko-wrapper input[type="number"], #taiko-wrapper #song-search-input, #taiko-wrapper #saved-songs-list { width: 100%; background-color: #2a344d; color: var(--panel-text); border: 1px solid var(--panel-border); border-radius: 6px; padding: 8px; font-size: 1em; box-sizing: border-box; }
        #taiko-wrapper #song-search-input { text-align: left; padding-left: 12px; }
        #taiko-wrapper #saved-songs-list { padding: 8px; text-align: center; text-align-last: center; -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        #taiko-wrapper #taiko-key-config-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        #taiko-wrapper .key-config-item { display: flex; flex-direction: column; }
        #taiko-wrapper .key-config-input { flex-grow: 1; height: 45px; background-color: #2a344d; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--panel-text); font-size: 1.3em; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; user-select: none; }
        #taiko-wrapper .key-config-input:hover { background-color: #394362; }
        #taiko-wrapper .key-config-input.is-waiting { background-color: var(--accent-color); border-color: var(--accent-color); outline: none; color: white; }
        #taiko-wrapper .checkbox-wrapper { display: flex; align-items: center; cursor: pointer; margin-bottom: 5px; }
        #taiko-wrapper input[type="checkbox"] { display: none; }
        #taiko-wrapper .custom-checkbox { width: 20px; height: 20px; background-color: #2a344d; border: 1px solid var(--panel-border); border-radius: 4px; display: inline-block; position: relative; margin-right: 10px; transition: background-color 0.2s; flex-shrink: 0; }
        #taiko-wrapper input[type="checkbox"]:checked + .custom-checkbox { background-color: var(--accent-color); }
        #taiko-wrapper .custom-checkbox::after { content: ''; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid white; border-width: 0 3px 3px 0; transform: rotate(45deg); display: none; }
        #taiko-wrapper input[type="checkbox"]:checked + .custom-checkbox::after { display: block; }
        #taiko-wrapper .control-button { width: 100%; padding: 12px; font-size: 1em; font-weight: 500; color: var(--panel-text); background-color: #394362; border: 1px solid var(--panel-border); border-radius: 8px; cursor: pointer; transition: background-color 0.2s; -webkit-appearance: none; text-align: center; }
        #taiko-wrapper .control-button:hover { background-color: #4a5578; }
        #taiko-wrapper .control-button:disabled { opacity: 0.45; cursor: not-allowed; }
        #taiko-wrapper .control-button:disabled:hover { background-color: #394362; }
        #taiko-wrapper #buttons-group { 
            grid-column: 1 / -1; 
            grid-row: 3;
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 15px; 
            margin-top: 10px;
        }
        #taiko-wrapper #taiko-start-button { 
            padding: 15px; 
            font-size: 1.2em; 
            font-weight: 600; 
            color: white; 
            background-color: var(--accent-color); 
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #taiko-wrapper #taiko-start-button:hover { background-color: #c9302c; }
        #taiko-wrapper #taiko-start-button:disabled, #taiko-wrapper #save-song-to-pc-button:disabled { background-color: var(--disabled-color); cursor: not-allowed; color: #8c92a3; }
        #taiko-wrapper #taiko-song-info { min-height: 80px; text-align: center; background: #2a344d; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; justify-content: center; border: 1px solid var(--panel-border); }
        #taiko-wrapper #taiko-ingame-pause-button { display: none; }
        #taiko-wrapper #taiko-ui-panel { position: absolute; top: 20px; right: 30px; color: white; z-index: 31; text-shadow: 0 0 8px rgba(0,0,0,0.8); text-align: right; font-weight: 600; }
        /* スコア：白い太鼓の上、少し左側（レーン上端のすぐ上）に表示。ゲーム画面は全画面固定なので fixed で画面基準に配置 */
        #taiko-wrapper #taiko-score { font-size: 2.5em; position: fixed; left: calc(180px + var(--ui-offset-x) - 120px); top: calc(50% - 215px); transform: translate(-100%, -100%); line-height: 1.1; text-align: right; white-space: nowrap; pointer-events: none; }
        #taiko-wrapper #taiko-ingame-song-title { font-size: 3em; max-width: 40vw; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #taiko-wrapper #taiko-accuracy { font-size: 1.5em; color: #FFD700; min-width: 5.5em; text-align: right; }
        #taiko-wrapper #taiko-accuracy-container { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
        #taiko-wrapper #combo-display { position: absolute; top: 50%; left: calc(180px + var(--ui-offset-x)); width: calc(120px * var(--lane-scale)); height: calc(120px * var(--lane-scale)); z-index: 20; font-weight: bold; color: white; text-shadow: 0 0 8px rgba(0,0,0,0.8); opacity: 0; transform: translate(-50%, calc(-50% - 58px - var(--lane-up))) scale(0.8); transition: opacity 0.2s, transform 0.2s; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        #taiko-wrapper #combo-display.visible { opacity: 1; transform: translate(-50%, calc(-50% - 58px - var(--lane-up))) scale(1); }

        #taiko-wrapper #roll-counter-display.visible { opacity: 1; }
        #taiko-wrapper #combo { font-size: calc(4.5em * var(--lane-scale)); line-height: 1; }
        #taiko-wrapper #combo-label { display: none; }
        #taiko-wrapper #taiko-judgment-text { position: absolute; top: calc(50% - 200px - 90px * (var(--lane-scale) - 1) - 44px * (var(--lane-scale) - 1) + var(--lane-shift) + var(--judgment-text-down, -6px)); left: calc(416px + var(--ui-offset-x)); transform: translateX(-50%); font-size: 3em; font-weight: bold; opacity: 0; z-index: 40; padding: 5px 20px; border-radius: 4px; color: white; text-align: center; text-shadow: 0 0 8px #000, 0 0 8px #000; animation: taiko-judgment-anim-new 0.4s ease-out; pointer-events: none; }
        @keyframes taiko-judgment-anim-new {
            0% { transform: translateX(-50%) translateY(5px); opacity: 1; }
            20% { transform: translateX(-50%) translateY(-3px); opacity: 1; }
            35%, 90% { transform: translateX(-50%) translateY(0); opacity: 1; }
            100% { transform: translateX(-50%) translateY(0); opacity: 0; }
        }
        #taiko-wrapper #progress-container { display: none; } 
        #taiko-wrapper .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
        #taiko-wrapper .overlay-menu { text-align: center; padding: 30px 40px; background-color: var(--panel-bg); border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.5); transform: scale(0.85); }
        #taiko-wrapper .overlay-menu h2 { font-size: 2.8em; margin-top: 0; margin-bottom: 30px; letter-spacing: 2px;}
        #taiko-wrapper .overlay-button { display: block; width: 220px; padding: 15px; margin: 12px auto; font-size: 1.2em; color: white; border: 2px solid var(--panel-border); background-color: #394362; border-radius: 8px; cursor: pointer; transition: background-color 0.2s, transform 0.1s; }
        #taiko-wrapper .overlay-button:hover { background-color: #4a5578; }
        #taiko-wrapper .overlay-button.selected { background-color: #ffffff; color: #1b2238; border-color: #ffffff; font-weight: bold; box-shadow: 0 0 12px rgba(255,255,255,0.6); }
        #taiko-wrapper .overlay-button:active { transform: scale(0.98); }
        #taiko-wrapper #results-menu #results-song-title { font-size: 1.2em; color: #a0a8c0; margin-top: -20px; margin-bottom: 25px;}
        #taiko-wrapper #results-menu .results-main-stats { display: flex; justify-content: space-around; gap: 30px; margin-bottom: 30px; }
        #taiko-wrapper #results-menu .results-item { text-align: center; }
        #taiko-wrapper #results-menu .results-item.rank-item { display: flex; flex-direction: column; align-items: center; }
        #taiko-wrapper .results-item span:first-child { display: block; font-size: 1em; color: #a0a8c0; margin-bottom: 5px;}
        #taiko-wrapper .results-item span:last-child { font-size: 2em; font-weight: 600;}
        #taiko-wrapper #results-rank-value { font-size: 2.5em; color: #FFD700; }
        #taiko-wrapper #results-menu .results-judgments { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 30px; text-align: center; }
        #taiko-wrapper .judgment-item span:first-child { font-size: 1.2em; font-weight: bold;}
        #taiko-wrapper #results-ryo { color: gold; }
        #taiko-wrapper #results-ka { color: white; }
        #taiko-wrapper #results-fuka { color: #dda0dd; }
        #taiko-wrapper #drum-display { position: absolute; width: calc(120px * var(--lane-scale)); height: calc(120px * var(--lane-scale)); top: 50%; left: calc(180px - 60px * var(--lane-scale) + var(--ui-offset-x)); transform: translateY(calc(-50% - 58px - var(--lane-up))); z-index: 15; pointer-events: none; }
        #taiko-wrapper .drum-body { width: 100%; height: 100%; background-color: #FFFFFF; border: 12px solid #FFFFFF; border-radius: 50%; box-sizing: border-box; position: absolute;box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.3); }
        #taiko-wrapper .drum-body::after { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 2px; height: 100%; background-color: rgba(0, 0, 0, 0.3); }
        #taiko-wrapper .drum-hit-area { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-radius: 50%; box-sizing: border-box; opacity: 0; transition: opacity 0.1s linear; }
        #taiko-wrapper .drum-hit-area.active { opacity: 1; transition: none; }
        #taiko-wrapper #drum-don-left, #taiko-wrapper #drum-don-right { width: calc(100% - 24px); height: calc(100% - 24px); top: 12px; left: 12px; background-color: rgba(255, 77, 109, 0.8); }
        #taiko-wrapper #drum-don-left { clip-path: polygon(0% 0%, 50% 0%, 50% 100%, 0% 100%); }
        #taiko-wrapper #drum-don-right { clip-path: polygon(50% 0%, 100% 0%, 100% 100%, 50% 100%); }
        #taiko-wrapper #drum-katsu-left { border: 12px solid rgba(77, 171, 247, 0.9); clip-path: polygon(0% 0%, 50% 0%, 50% 100%, 0% 100%); }
        #taiko-wrapper #drum-katsu-right { border: 12px solid rgba(77, 171, 247, 0.9); clip-path: polygon(50% 0%, 100% 0%, 100% 100%, 50% 100%); }

        #taiko-wrapper #norma-gauge.rainbow .gauge-inner { display: block; }
        /* 虹色のときは上下の余白をなくし、ゲージの枠いっぱいまで塗る */
        #taiko-wrapper #norma-gauge.rainbow { --gauge-pad: 0px; }
        /* ゲージMAX時：虹色が左から右へ流れる（ゲージの長さ・縦線の区切りはそのまま） */
        #taiko-wrapper #norma-gauge { --rb-len: 1050px; --rb-grad: linear-gradient(90deg, #8f7bff 0%, #a85cff 9%, #ff5cf3 20%, #ff5c9a 30%, #ff8a5c 40%, #ffd23a 52%, #8cff3a 64%, #3affc4 76%, #5cd0ff 88%, #8f7bff 100%); }
        #taiko-wrapper #norma-gauge.rainbow .gauge-fill { background: var(--rb-grad) 0 0 / var(--rb-len) 100% repeat-x; }
        #taiko-wrapper #norma-gauge.rainbow .gauge-fill-hot { background: var(--rb-grad) calc(var(--hotleft, 0px) * -1) 0 / var(--rb-len) 100% repeat-x; }
        #taiko-wrapper #norma-gauge.rainbow .gauge-fill::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 14px, rgba(0,0,0,0.30) 14px 21px); }
        #taiko-wrapper #norma-gauge.rainbow .gauge-fill-hot::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; right: var(--ycell, 21px); background: repeating-linear-gradient(90deg, rgba(0,0,0,0.12) 0 calc(var(--ycell, 21px) / 21), transparent calc(var(--ycell, 21px) / 21) calc(var(--ycell, 21px) * 14 / 21), rgba(0,0,0,0.30) calc(var(--ycell, 21px) * 14 / 21) var(--ycell, 21px)); }
        #taiko-wrapper #norma-gauge.full .gauge-fill-hot::after { display: none; }
        /* ノルマ達成のみ(100%未満)の虹色：最後の1マスも縦線を出す */
        #taiko-wrapper #norma-gauge.rainbow:not(.full) .gauge-fill-hot::before { right: 0; }
        @keyframes gauge-rainbow-fill { from { background-position: 0 0; } to { background-position: var(--rb-len) 0; } }
        @keyframes gauge-rainbow-hot { from { background-position: calc(var(--hotleft, 0px) * -1) 0; } to { background-position: calc(var(--hotleft, 0px) * -1 + var(--rb-len)) 0; } }
        #taiko-wrapper #results-clear-status { font-size: 1.6em; font-weight: bold; margin: -10px 0 18px; text-align: center; }
        #taiko-wrapper #results-clear-status.clear { color: #ffd700; }
        #taiko-wrapper #results-clear-status.failed { color: #a0a8c0; }
        #taiko-wrapper #results-clear-status.fullcombo { color: #ffd700; text-shadow: 0 0 10px #ff9d00, 0 0 20px #ff6a00; }
        #taiko-wrapper #results-clear-status.allperfect { background: linear-gradient(90deg,#ff5e5e,#ffd34d,#7dff7d,#4dd2ff,#b57dff,#ff5e5e); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 6px rgba(255,255,255,0.6)); background-size: 300% 100%; animation: taiko-niji-flow 3s linear infinite; }
        @keyframes taiko-niji-flow { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
        @keyframes branch-pop { 0% { transform: scale(1.5); opacity: 0.2; } 100% { transform: scale(1); opacity: 1; } }

        /* --- Taiko Hit Error Bar Styles START --- */
         #taiko-wrapper #taiko-error-bar-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 40%; height: 14px; z-index: 25; border-radius: 10px; background: linear-gradient(to right, #b29d38, #a6c84a, #6ee099 40%, #45eede 50%, #6ee099 60%, #a6c84a, #b29d38 ); box-shadow: 0 0 8px 2px rgba(115, 228, 153, 0.5), inset 0 0 3px rgba(0,0,0,0.4); overflow: visible; }
        #taiko-wrapper #taiko-error-bar { position: relative; width: 100%; height: 100%; }
         #taiko-wrapper #taiko-error-bar::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 3px; height: 120%; background-color: rgba(255, 255, 255, 0.9); box-shadow: 0 0 5px #fff, 0 0 10px #00ffff; border-radius: 2px; }
        #taiko-wrapper .error-tick { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 3px; height: 150%; background-color: white; box-shadow: 0 0 8px white, 0 0 15px #00ffff; border-radius: 3px; opacity: 0; animation: taiko-error-tick-anim 1.5s ease-out forwards; }
        @keyframes taiko-error-tick-anim { 0% { opacity: 1; transform: translate(-50%, -50%) scaleY(1.2); } 100% { opacity: 0; transform: translate(-50%, -50%) scaleY(0.8); } }
        /* --- Taiko Hit Error Bar Styles END --- */

        #taiko-wrapper #taiko-gameplay-progress-pie { position: relative; top: 0px; left: 0px; }
        #taiko-wrapper #taiko-accuracy-container { display: none !important; }
        #taiko-wrapper #taiko-error-bar-container { display: none !important; }

        .shortcut-key-control { margin-top: 10px; }
        .shortcut-key-inputs { display: flex; gap: 15px; justify-content: center; }
        .shortcut-key-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .shortcut-key-item > span { font-size: 0.9em; color: #a0a8c0; }
        .shortcut-key-item .key-config-input { width: 80px; }
        #taiko-wrapper .shortcut-key-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
        /* テキスト選択・コピーを無効化(入力欄は除く) */
        html, body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
        input, textarea, [contenteditable="true"] { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }

        /* フォーカス時の白い縁(アウトライン)を非表示 */
        button, select, a, summary, [tabindex], input[type="checkbox"], input[type="range"] { outline: none !important; -webkit-tap-highlight-color: transparent; }
        button:focus, button:focus-visible, select:focus, select:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: none !important; }

    <script>
    // --- Global Controller ---
    let activeGame = 'taiko';

    let shortcutKeys = {
        retry: 'R',
        menu: 'H'
    };

    function saveGlobalSettings() {

    function loadGlobalSettings() {
        try {
            const settings = JSON.parse(localStorage.getItem('rhythmGameGlobalSettings'));
            if (settings && settings.shortcuts) {
                shortcutKeys = { ...shortcutKeys, ...settings.shortcuts };
            }
        } catch (e) {
            console.error("Failed to load global settings:", e);
        }
    }

    function initializeShortcutKeySetup(retryElementId, menuElementId) {
        const retryInput = document.getElementById(retryElementId);
        const menuInput = document.getElementById(menuElementId);
        if (!retryInput || !menuInput) return;

        const updateUI = () => {
            document.querySelectorAll('[data-shortcut-for="retry"]').forEach(el => el.textContent = shortcutKeys.retry);
            document.querySelectorAll('[data-shortcut-for="menu"]').forEach(el => el.textContent = shortcutKeys.menu);
        };
        updateUI();

        const setupListener = (element, keyName) => {
            element.addEventListener('click', () => {
                document.querySelectorAll('.key-config-input.is-waiting').forEach(el => el.blur());
                element.textContent = '...';
                element.classList.add('is-waiting');
            });

            element.addEventListener('keydown', (e) => {
                e.preventDefault();
                if (!element.classList.contains('is-waiting')) return;
                if (e.key === 'Escape') {
                    element.blur();
                    return;
                }
                const newKey = e.key.toUpperCase();
                if (newKey.length === 1 || e.code.startsWith('F')) {
                     shortcutKeys[keyName] = newKey;
                     saveGlobalSettings();
                     updateUI();
                     element.blur();
                }
            });

            element.addEventListener('blur', () => {
                element.classList.remove('is-waiting');
                updateUI();
            });
        };

        setupListener(retryInput, 'retry');
        setupListener(menuInput, 'menu');
    }

    function drawProgressPie(canvasId, progress) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = Math.min(centerX, centerY) * 0.9;

        progress = Math.max(0, Math.min(1, progress));

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI, false);
        ctx.fillStyle = '#3a4360';
        ctx.fill();

        if (progress > 0) {
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, -Math.PI / 2, (-Math.PI / 2) + (progress * 2 * Math.PI), false);
            ctx.closePath();
            ctx.fillStyle = '#cccccc';
            ctx.fill();
        }
    }

            activeElement.isContentEditable

        if (e.key === 'Escape' && !e.repeat) {
             e.preventDefault();
             if (activeGame === 'taiko') TaikoGame.togglePauseExternal();
        }

        // --- リトライキーの処理 ---
        if (e.key.toUpperCase() === shortcutKeys.retry.toUpperCase() && !e.repeat) {
            if (isTyping) return;

            e.preventDefault();

            if (isRetryOnCooldown) {
                return;
            }

            isRetryOnCooldown = true;
            setTimeout(() => {
                isRetryOnCooldown = false;
            }, 3000);

            if (activeGame === 'taiko') TaikoGame.retryGameExternal();
        }

        // --- メニューキーの処理 ---
        if (e.key.toUpperCase() === shortcutKeys.menu.toUpperCase() && !e.repeat) {
            if (isTyping) return;

    });

            init() {
                const NEEDED = [this.SONGS_STORE, this.SE_STORE, this.BG_STORE];
                const openDb = (version) => new Promise((resolve, reject) => {
                    const request = version ? indexedDB.open(this.DB_NAME, version) : indexedDB.open(this.DB_NAME);
                    request.onupgradeneeded = (event) => {
                        const d = event.target.result;
                        NEEDED.forEach(name => { if (!d.objectStoreNames.contains(name)) d.createObjectStore(name, { keyPath: 'id' }); });
                    };
                    request.onblocked = () => { alert('別のタブやウィンドウでこのプレイヤーが開かれています。\n他のタブを閉じてから、このページを再読み込みしてください。（保存済みの譜面は消えていません）'); };
                    request.onsuccess = (event) => {
                        const d = event.target.result;
                        d.onversionchange = () => { d.close(); };   // 他のタブがデータベースを更新できるように、こちらは閉じる
                        resolve(d);
                    };
                    request.onerror = (event) => { console.error('Database error:', request.error); reject(request.error || event.target.errorCode); };
                });
                return (async () => {
                    let d = await openDb();
                    const missing = NEEDED.filter(name => !d.objectStoreNames.contains(name));
                    if (missing.length > 0) {
                        const next = Math.max(d.version + 1, this.DB_VERSION);
                        d.close();
                        d = await openDb(next);
                    }
                    this._db = d;
                })();

                    request.onerror = (event) => reject(event.target.error);

                        else { tag = gogoStartTag; region = gogoStartRegion; }
                        const emit = (tag === 'C') ? (target === 'N') : (tag === target);
                        if (emit) out.gogos.push({ start, end, branch: tag, region });
                    };

                    const processMeasure = () => {
                        if (measureLines.length === 0) return;
                        measureCounter++;

                        let noteChars = "";
                        let commands = [];
                        let charCount = 0;
                        let balloonUse = 0;

                        // まず小節内の文字とコマンドを分離
                        for (let line of measureLines) {
                            if (line.startsWith('#')) {
                                commands.push({ index: charCount, cmd: line });
                            } else {
                                const cleanLine = line.replace(/,/g, '');
                                noteChars += cleanLine;
                                charCount += cleanLine.length;
                            }
                        }

                        // --- 小節の先頭（index === 0）のコマンドを先行評価 ---
                        // 理由: 小節線の描画タイミングでの速度と表示有無を正確に決定するため
                        let tempBpmForBar = currentBPM;
                        let tempScrollForBar = scrollSpeed;
                        let tempIsBpmScroll = isBpmScroll;

                        for (let c of commands) {
                            if (c.index === 0) {
                                const parts = c.cmd.trim().split(/\s+/);
                                const upperCmd = parts[0].toUpperCase();
                                if (upperCmd === '#BPMCHANGE' && parts[1]) tempBpmForBar = parseFloat(parts[1]) || tempBpmForBar;
                                if (upperCmd === '#SCROLL' && parts[1]) tempScrollForBar = parseFloat(parts[1]) || tempScrollForBar;
                                if (upperCmd === '#BMSCROLL') tempIsBpmScroll = true;
                                if (upperCmd === '#HBSCROLL') tempIsBpmScroll = false;
                                if (upperCmd === '#BARLINEOFF') isBarlineOn = false;
                                if (upperCmd === '#BARLINEON') isBarlineOn = true;
                            }
                        }

                        // 小節線の速度決定と描画
                        let barScrollSpeed = tempScrollForBar;
                        if (!tempIsBpmScroll) {
                            barScrollSpeed = tempScrollForBar * (tempBpmForBar / baseBPM);
                        }
                        if (isBarlineOn && curEmit) {
                            out.bars.push({ time: currentTime, scrollSpeed: barScrollSpeed, branch: curTag, region: curRegion, num: measureCounter });
                        }

                        // 1小節と1文字あたりの時間を計算
                        let msPerMeasure = (60000 / currentBPM) * 4 * measureRatio;
                        let msPerChar = charCount > 0 ? msPerMeasure / charCount : 0;
                        let tempTime = currentTime;

                        // コマンド実行用の関数（安全なパース機構）
                        const processCommand = (cmdStr, cmdTime) => {
                            const parts = cmdStr.trim().split(/\s+/);
                            const cmd = parts[0].toUpperCase();

                            if (cmd === '#BPMCHANGE' && parts[1]) {
                                const val = parseFloat(parts[1]);
                                if (!isNaN(val)) currentBPM = val;
                            } else if (cmd === '#SCROLL' && parts[1]) {
                                const val = parseFloat(parts[1]);
                                if (!isNaN(val)) scrollSpeed = val;
                            } else if (cmd === '#MEASURE' && parts[1]) {
                                const ratioParts = parts[1].split('/');
                                if (ratioParts.length === 2) {
                                    const num = parseFloat(ratioParts[0]);
                                    const den = parseFloat(ratioParts[1]);
                                    if (!isNaN(num) && !isNaN(den) && den !== 0) {
                                        measureRatio = num / den;
                                    }
                                }
                            } else if (cmd === '#GOGOSTART') {
                                isGoGo = true;
                                gogoStartTime = cmdTime;
                                gogoStartTag = curTag;
                                gogoStartRegion = curRegion;
                            } else if (cmd === '#GOGOEND') {
                                if (isGoGo && gogoStartTime !== -1) {
                                    pushGoGo(gogoStartTime, cmdTime);
                                    gogoStartTime = -1;
                                }
                                isGoGo = false;
                            } else if (cmd === '#DELAY' && parts[1]) {
                                const delaySeconds = parseFloat(parts[1]);
                                if (!isNaN(delaySeconds)) {
                                    tempTime += delaySeconds * 1000;
                                    currentTime += delaySeconds * 1000;
                                }
                            } else if (cmd === '#BMSCROLL') {
                                isBpmScroll = true;
                            } else if (cmd === '#HBSCROLL') {
                                isBpmScroll = false;
                            } else if (cmd === '#BARLINEOFF') {
                                isBarlineOn = false;
                            } else if (cmd === '#BARLINEON') {
                                isBarlineOn = true;
                            } else if (cmd === '#SECTION') {
                                // 分岐判定用カウンタのリセット位置
                                if (target === 'N') out.sections.push({ time: cmdTime });
                            } else if (cmd === '#LEVELHOLD') {
                                // 以降、現在の譜面(普通/玄人/達人)を固定
                                if (target === 'N') out.levelholds.push({ time: cmdTime });
                            }
                        };

                        // 文字ごとに時間を進めながらノーツを配置
                        for (let i = 0; i < noteChars.length; i++) {
                            // この文字のタイミングにあるコマンドを実行
                            const cmdsAtThisIndex = commands.filter(c => c.index === i);
                            for (let c of cmdsAtThisIndex) {
                                processCommand(c.cmd, tempTime);
                                msPerMeasure = (60000 / currentBPM) * 4 * measureRatio;
                                msPerChar = charCount > 0 ? msPerMeasure / charCount : 0;
                            }

                            // BPM連動スクロールを反映
                            let effectiveScrollSpeed = scrollSpeed;
                            if (!isBpmScroll) {
                                effectiveScrollSpeed = scrollSpeed * (currentBPM / baseBPM);
                            }

                            const ch = noteChars[i];
                            const noteProps = {
                                time: tempTime,
                                judged: false,
                                scrollSpeed: effectiveScrollSpeed,
                                sePlayed: false,
                                branch: curTag,
                                region: curRegion
                            };

                            if (ch === '1' || ch === '3') {
                                if (curEmit) out.notes.push({ ...noteProps, type: 'don', isBig: ch === '3' });
                            } else if (ch === '2' || ch === '4') {
                                if (curEmit) out.notes.push({ ...noteProps, type: 'katsu', isBig: ch === '4' });
                            } else if (ch === '5' || ch === '6') {
                                if (!activeRoll) {
                                    activeRoll = { ...noteProps, type: 'roll', isBig: ch === '6', hitsMade: 0, lastAutoHitTime: 0 };
                                    if (curEmit) out.notes.push(activeRoll);
                                }
                            } else if (ch === '7' || ch === '9') {
                                const seq = measureBalloonSeqs[balloonUse++];
                                if (!activeRoll) {
                                    let reqHits = 5;
                                    if (seq !== undefined && seq < balloons.length) {
                                        reqHits = balloons[seq];
                                    }
                                    activeRoll = { ...noteProps, type: 'balloon', isBig: false, hitsRequired: reqHits, hitsMade: 0, lastAutoHitTime: 0 };
                                    if (curEmit) out.notes.push(activeRoll);
                                }
                            } else if (ch === '8') {
                                if (activeRoll) {
                                    activeRoll.endTime = tempTime;
                                    activeRoll = null;
                                }
                            }

                            tempTime += msPerChar;
                        }

                        // 小節の最後（文字の後）に置かれたコマンドの実行
                        const cmdsAtEnd = commands.filter(c => c.index === charCount);
                        for (let c of cmdsAtEnd) {
                            processCommand(c.cmd, tempTime);
                        }

                        currentTime += msPerMeasure;
                        measureLines = [];
                        measureBalloonSeqs = [];
                    };

                    for (let i = 0; i < rawLines.length; i++) {
                        const line = rawLines[i];
                        const upper = line.toUpperCase();

                        if (upper.startsWith('#START')) {
                            isParsing = true;
                            // 2P譜面(#START P2)は読み込まない
                            skipP2 = /^#START\s+P2\b/i.test(line);
                            continue;
                        }
                        if (upper.startsWith('#END')) {
                            processMeasure();
                            isParsing = false;
                            skipP2 = false;
                            continue;
                        }

                        if (!isParsing || skipP2) continue;

                        // --- 分岐コマンド ---
                        if (upper.startsWith('#BRANCHSTART')) {
                            regionIdx++;
                            inBr = true;
                            const info = regionInfo[regionIdx] || { N: false, E: false, M: false };
                            // 自分の分岐が無ければ普通(N)の内容で時間だけ進める（出力はしない）
                            activeMarker = info[target] ? target : (info.N ? 'N' : (info.E ? 'E' : 'M'));
                            curTag = 'C'; curRegion = -1; curEmit = (target === 'N'); skipLines = false;

                            if (target === 'N') {
                                const params = line.substring('#BRANCHSTART'.length).split(/[,\s]+/).filter(s => s.length > 0);
                                const type = (params[0] || 'p').toLowerCase();
                                let eThr = parseFloat(params[1]);
                                let mThr = parseFloat(params[2]);
                                if (isNaN(eThr)) eThr = Infinity;
                                if (isNaN(mThr)) mThr = Infinity;

                                if (!isBpmScroll) sp *= (currentBPM / baseBPM);

                            }
                            continue;
                        }
                        if (upper.startsWith('#BRANCHEND')) {
                            inBr = false;
                            curTag = 'C'; curRegion = -1; curEmit = (target === 'N'); skipLines = false;
                            if (target === 'N') {
                                out.endStates[regionIdx] = { time: currentTime, bpm: currentBPM, scroll: scrollSpeed, ratio: measureRatio, bpmScroll: isBpmScroll, barline: isBarlineOn };
                            } else if (syncStates && syncStates[regionIdx]) {
                                // 各分岐の長さが食い違っていても、分岐後は普通譜面と同じ時刻・状態から再開する
                                const s = syncStates[regionIdx];
                                currentTime = s.time; currentBPM = s.bpm; scrollSpeed = s.scroll;
                                measureRatio = s.ratio; isBpmScroll = s.bpmScroll; isBarlineOn = s.barline;
                            }
                            continue;
                        }

                        // ※ #MEASURE / #NEXTSONG 等と誤認しないよう、完全一致で判定する
                        const marker = line.split(/\s+/)[0].toUpperCase();
                        if (marker === '#N' || marker === '#E' || marker === '#M') {
                            if (inBr) {
                                const m = marker.charAt(1);
                                if (m === activeMarker) {
                                    skipLines = false;
                                    curTag = m; curRegion = regionIdx; curEmit = (m === target);
                                } else {
                                    skipLines = true;
                                }
                            }
                            continue;
                        }

                        if (skipLines) continue;

                        if (line.startsWith('#')) {
                            measureLines.push(line);
                        } else {
                            let remain = line;
                            let lb = lineBalloonStart[i];
                            const takeSeqs = (piece) => {
                                for (const ch of piece) { if (ch === '7' || ch === '9') measureBalloonSeqs.push(lb++); }
                            };
                            while (remain.includes(',')) {
                                const commaIdx = remain.indexOf(',');
                                const piece = remain.substring(0, commaIdx + 1);
                                takeSeqs(piece);
                                measureLines.push(piece);
                                processMeasure();
                                remain = remain.substring(commaIdx + 1).trim();
                            }
                            if (remain.length > 0) {
                                takeSeqs(remain);
                                measureLines.push(remain);
                            }
                        }
                    }

                    // 行末に#ENDがない等のイレギュラーに対応
                    if (measureLines.length > 0) {
                        processMeasure();
                    }

                    if (isGoGo && gogoStartTime !== -1) {
                        pushGoGo(gogoStartTime, currentTime);
                    }

                    return out;
                };

                const passN = runPass('N', null);
                const passE = regionInfo.length > 0 ? runPass('E', passN.endStates) : null;
                const passM = regionInfo.length > 0 ? runPass('M', passN.endStates) : null;
                const passes = [passN, passE, passM].filter(p => p);

                hitObjects = [];
                barLines = [];
                goGoSections = [];
                for (const p of passes) {
                    hitObjects.push(...p.notes);
                    barLines.push(...p.bars);
                    goGoSections.push(...p.gogos);
                }
                branchRegions = passN.regions.map((r, i) => ({ ...r, has: regionInfo[i] || { N: true, E: false, M: false } }));
                sectionPoints = passN.sections;
                levelHoldPoints = passN.levelholds;

                hitObjects.sort((a, b) => a.time - b.time);

                for (let obj of hitObjects) {
                    if ((obj.type === 'roll' || obj.type === 'balloon') && obj.endTime === undefined) {
                        obj.endTime = obj.time + 1000;
                    }
                }

                lastNoteTime = 1;
                for (const obj of hitObjects) {
                    const t = obj.endTime || obj.time;
                    if (t > lastNoteTime) lastNoteTime = t;
                }
                return hitObjects.length > 0;

            } catch (error) {
                console.error("Error during .tja parsing:", error);
                alert("譜面の解析に失敗しました。");
                return false;
            }
        }

                if (lower.includes('__macosx/')) return;
                const bn = lower.split('/').pop();
                const dot = bn.lastIndexOf('.');
                const ext = dot >= 0 ? bn.substring(dot) : '';
                if (!SE_AUDIO_EXTS.includes(ext)) return;
                const stem = bn.substring(0, dot);
                for (const t of ['don', 'katsu']) {
                    if (!found[t] && SE_ZIP_NAMES[t].includes(stem)) found[t] = entry;
                }
            });
            if (!found.don && !found.katsu) return null;
            if (!audioContext) initAudioContext();
            const rec = { id: `selib-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, name: setName, added: Date.now(), size: 0, don: null, katsu: null };
            for (const t of ['don', 'katsu']) {
                if (!found[t]) continue;
                const ab = await found[t].async('arraybuffer');
                await audioContext.decodeAudioData(ab.slice(0));   // 音声として読めるか確認
                rec[t] = ab;
                rec.size += ab.byteLength;
            }
            await db.addSELib(rec);
            seLibrary.push({ id: rec.id, name: rec.name, size: rec.size });
            return rec.id;
        }

        async function handleNewFiles(e) {

            if (!files || files.length === 0) return;
            dom.oszFileLabel.classList.add('is-loading');
            dom.oszFileInput.disabled = true;
            let successCount = 0;
            let errorCount = 0;
            const batch = files.length >= 2 ? askBatchGenre(files.length) : { mode: 'each' };
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                dom.songTitleElement.textContent = `処理中 (${i + 1}/${files.length})...`;
                dom.songArtistElement.textContent = file.name;

                if (!file.name.toLowerCase().endsWith('.zip') && !file.name.toLowerCase().endsWith('.tja')) {
                    console.warn(`Skipping non-zip file: ${file.name}`);
                    errorCount++;
                    continue;
                }
                try {
                    const tempZip = new JSZip();
                    const loadedZip = await tempZip.loadAsync(file, { decodeFileName: decodeZipFileName });
                    const tjaFiles = [];
                    loadedZip.forEach((relativePath, zipEntry) => {
                        if (relativePath.toLowerCase().endsWith('.tja')) {
                            tjaFiles.push(zipEntry);
                        }
                    });

                    if (tjaFiles.length === 0) {
                        console.warn(`Skipping zip without .tja file: ${file.name}`);
                        errorCount++;
                        continue;
                    }

                    let firstTjaContent = null;
                    for (const tjaFile of tjaFiles) {
                         const uint8array = await tjaFile.async('uint8array');
                         firstTjaContent = decodeTjaContent(uint8array);
                         break;
                    }

                    const tempInfo = { title: 'Unknown', artist: '' };
                    if (firstTjaContent) {
                        const lines = firstTjaContent.split('\n');
                        for (const line of lines) {
                            const match = line.match(/^([A-Z0-9_]+):(.*)/i);
                            if(match) {
                                if(match[1].toUpperCase() === 'TITLE' && !tempInfo.titleJa) tempInfo.title = match[2].trim();
                                if(match[1].toUpperCase() === 'TITLEJA' && match[2].trim()) { tempInfo.titleJa = true; tempInfo.title = match[2].trim(); }
                                if(match[1].toUpperCase() === 'ARTIST') tempInfo.artist = match[2].trim();
                                if(match[1].toUpperCase() === 'GENRE') tempInfo.genreText = match[2].trim();
                            }
                        }
                    }

                    const guessed = guessGenreFromHeader(tempInfo.genreText);
                    const genre = batch.mode === 'all' ? batch.genre : (batch.mode === 'auto' ? guessed : askGenre(tempInfo.title || file.name, guessed));
                    const songData = { id: `${Date.now()}-${file.name}`, title: tempInfo.title, artist: tempInfo.artist, genre, blob: file };
                    await db.addSong(songData);
                    successCount++;
                } catch (err) {
                    console.error(`Failed to process file ${file.name}:`, err);
                    errorCount++;
                    if (err.name === 'QuotaExceededError') {
                        alert(`「${file.name}」の保存に失敗しました。\nブラウザの保存容量が上限に達した可能性があります。不要な譜面を削除して、再度お試しください。`);
                    }

            dom.songTitleElement.textContent = '譜面を選択してください';
            dom.songArtistElement.textContent = '';
            dom.oszFileLabel.classList.remove('is-loading');

            e.target.value = '';
            if (errorCount > 0) {
                console.warn(`${errorCount}個のファイルは読み込めずスキップしました。`);

            if (successCount > 0) {
               alert(`${successCount}個の譜面を保存しました。`);
            }
            if (successCount > 0) {

                resetGameAndFiles(true);

        async function processOszBlob(blob) {
            resetGameAndFiles(false);
            dom.songTitleElement.textContent = '読み込み中...';
            dom.songArtistElement.textContent = '';
            try {
                osz_zip = new JSZip();
                const zip = await osz_zip.loadAsync(blob, { decodeFileName: decodeZipFileName });
                const filePromises = [];
                osz_beatmaps = [];
                const videoEntries = [], imageEntries = [];
                
                zip.forEach((relativePath, zipEntry) => {
                    if (zipEntry.dir) return;
                    const lowerCasePath = relativePath.toLowerCase();
                    if (lowerCasePath.endsWith('.tja')) {
                        filePromises.push(zipEntry.async('uint8array').then(uint8array => {
                            let content = decodeTjaContent(uint8array);
                            const courses = splitTjaToCourses(content, relativePath);
                            osz_beatmaps.push(...courses);
                        }));
                    } else if (BG_VIDEO_EXTS.some(ext => lowerCasePath.endsWith(ext))) {
                        videoEntries.push({ path: relativePath, entry: zipEntry });
                    } else if (BG_IMAGE_EXTS.some(ext => lowerCasePath.endsWith(ext))) {
                        imageEntries.push({ path: relativePath, entry: zipEntry });
                    }
                });
                await Promise.all(filePromises);

                // TJAのBGMOVIE / BGIMAGEで指定された背景を優先し、無ければ最初に見つかったものを使う
                const headerInfo = osz_beatmaps.length > 0 ? osz_beatmaps[0].info : {};
                const pickEntry = (list, wanted, strict) => {
                    if (list.length === 0) return null;
                    if (wanted) {
                        const w = wanted.replace(/\\/g, '/').replace(/^["']|["']$/g, '').trim().toLowerCase().split('/').pop();
                        const wNoExt = w.includes('.') ? w.substring(0, w.lastIndexOf('.')) : w;
                        const exact = list.find(it => it.path.replace(/\\/g, '/').toLowerCase().split('/').pop() === w);
                        if (exact) return exact;
                        const loose = list.find(it => {
                            const b = it.path.replace(/\\/g, '/').toLowerCase().split('/').pop();
                            return (b.includes('.') ? b.substring(0, b.lastIndexOf('.')) : b) === wNoExt;
                        });
                        if (loose) return loose;
                    }
                    return strict ? null : list[0];
                };
                const toTypedBlob = async (item) => {
                    const raw = await item.entry.async('blob');
                    const ext = item.path.toLowerCase().split('.').pop();
                    return new Blob([raw], { type: BG_MIME[ext] || raw.type });
                };
                // 1) TJAにBGMOVIE/BGIMAGEの指定があり、ZIP内に見つかればそれを最優先
                // 2) 指定が無い（または見つからない）場合は、別に用意した背景（customBg）を使う
                // 3) 別に用意した背景も無い場合のみ、ZIP内で最初に見つかったものを使う
                const tjaV = headerInfo.bgmovie ? pickEntry(videoEntries, headerInfo.bgmovie, true) : null;
                const tjaI = headerInfo.bgimage ? pickEntry(imageEntries, headerInfo.bgimage, true) : null;
                tjaBgSpecified = { video: !!tjaV, image: !!tjaI };
                const vItem = tjaV || (customBg ? null : pickEntry(videoEntries, '', false));
                const iItem = tjaI || (customBg ? null : pickEntry(imageEntries, '', false));
                if (vItem) availableBackgrounds.video = URL.createObjectURL(await toTypedBlob(vItem));
                if (iItem) availableBackgrounds.image = URL.createObjectURL(await toTypedBlob(iItem));
                applyCustomBackground(false);
                updateBackgroundSelector();
                if (customBg) { const t = getPreferredBgType(); dom.backgroundSelect.value = t; selectedBackgroundType = t; }
                
                if (osz_beatmaps.length === 0) {
                    throw new Error('.tjaファイルが見つかりませんでした。');
                }
                
                dom.beatmapSelector.innerHTML = '<option value="">-- 難易度を選択 --</option>';
                osz_beatmaps.sort((a, b) => a.info.difficulty - b.info.difficulty);
                osz_beatmaps.forEach((beatmap, index) => {
                    const levelText = beatmap.info.level ? ` (☆${beatmap.info.level})` : '';
                    const optionText = `${beatmap.info.version}${levelText}`;
                    const option = new Option(optionText, index);
                    dom.beatmapSelector.appendChild(option);
                });
                dom.beatmapSelectorContainer.style.display = 'block';
                dom.beatmapSelector.selectedIndex = 1;
                handleBeatmapSelection();
            } catch (err) {
                alert('譜面の処理に失敗しました: ' + err.message);
                console.error(err);
                resetGameAndFiles(false);
            }
        }

        async function handleBeatmapSelection() {
            const selectedIndex = dom.beatmapSelector.value;
            beatmapLoaded = false;
            audioLoaded = false;
            checkReadyState();

            if (selectedIndex === "") {
                dom.songTitleElement.textContent = '難易度を選択してください';

            const selectedOsu = osz_beatmaps[parseInt(selectedIndex, 10)];
            if (!selectedOsu) return;

            if (parseTjaCourse(selectedOsu)) {
                beatmapLoaded = true;
                setSongTitleDisplay(dom.songTitleElement, songInfo.title || '（タイトル不明）', songInfo.subtitle);
                dom.songArtistElement.textContent = songInfo.artist || '';

                loadTaikoBeatmapSpecificSettings();

                if (availableBackgrounds.video || availableBackgrounds.image) {
                    if (tjaBgSpecified.video && availableBackgrounds.video) {
                        dom.backgroundSelect.value = 'video';
                    } else if (tjaBgSpecified.image && availableBackgrounds.image) {
                        dom.backgroundSelect.value = 'image';
                    } else if (customBg && availableBackgrounds[customBg.type]) {
                        dom.backgroundSelect.value = customBg.type;
                    } else if (availableBackgrounds.video) {
                        dom.backgroundSelect.value = 'video';
                    } else if (availableBackgrounds.image) {
                        dom.backgroundSelect.value = 'image';
                    }
                    selectedBackgroundType = dom.backgroundSelect.value;
                    saveTaikoBeatmapSpecificSettings();
                }

                // --- 音声ファイルの検索処理 ---
                let audioFileEntry = null;

                if (osz_zip) {
                    // 1. TJAのWAVE指定の名前で検索（拡張子抜きで比較）
                    if (songInfo.audioFilename) {
                        let targetAudioName = songInfo.audioFilename.replace(/\\/g, '/').toLowerCase();
                        targetAudioName = targetAudioName.replace(/^["']|["']$/g, '').trim();
                        const targetBasename = targetAudioName.split('/').pop();
                        // 拡張子がある場合のみ取り除く
                        const targetNoExt = targetBasename.includes('.') ? targetBasename.substring(0, targetBasename.lastIndexOf('.')) : targetBasename;

                        audioFileEntry = Object.values(osz_zip.files).find(file => {
                            if (file.dir) return false;
                            const name = file.name.replace(/\\/g, '/').toLowerCase();
                            const basename = name.split('/').pop();
                            const nameNoExt = basename.includes('.') ? basename.substring(0, basename.lastIndexOf('.')) : basename;
                            
                            return nameNoExt === targetNoExt && 
                                   (name.endsWith('.mp3') || name.endsWith('.ogg') || name.endsWith('.wav'));
                        });
                    }

                    // 2. 見つからない場合(SJIS文字化けやWAVE指定ミス)は、ZIP内の音声ファイルを適当に1つ探す
                    if (!audioFileEntry) {
                        audioFileEntry = Object.values(osz_zip.files).find(file => {
                            if (file.dir) return false;
                            const name = file.name.toLowerCase();
                            return name.endsWith('.mp3') || name.endsWith('.ogg') || name.endsWith('.wav');
                        });
                    }

                    // 音声が見つかったら読み込む
                    if (audioFileEntry) {
                        try {
                            const audioBlob = await audioFileEntry.async('blob');
                            if (audioSrc) URL.revokeObjectURL(audioSrc);
                            audioSrc = URL.createObjectURL(audioBlob);
                            dom.audioPlayer.src = audioSrc;
                            audioLoaded = true;
                        } catch (e) {
                            alert(`音声ファイルの読み込みに失敗しました。`);
                        }
                    } else {
                        alert(`ZIP内に音声ファイルが見つかりません。`);
                    }
                }

            } else {
                beatmapLoaded = false;
                audioLoaded = false;
                dom.songTitleElement.textContent = '非対応の譜面です';
                dom.songArtistElement.textContent = '太鼓さん次郎の難易度を選択してください';
                alert('この譜面の解析に失敗しました。');
            }
            checkReadyState();
        }

        function checkReadyState() { dom.startButton.disabled = !(beatmapLoaded && audioLoaded); }
        // --- 背景画像の高画質表示 ---
        // 画面より大きい画像をブラウザの標準縮小に任せると荒く（ジャギー）見えるため、
        // 高品質スムージング＋段階的な縮小で画面の実ピクセルサイズに合わせてから表示する
        const hqBgCache = new Map(); // 元URL -> { key, url }
        function clearHqBgCache() { hqBgCache.forEach(v => { if (v.url && v.url !== v.src) URL.revokeObjectURL(v.url); }); hqBgCache.clear(); }
        async function getHqBgUrl(srcUrl) {
            try {
                const dpr = window.devicePixelRatio || 1;
                const tw = Math.max(1, Math.round(window.innerWidth * dpr));
                const th = Math.max(1, Math.round(window.innerHeight * dpr));
                const key = tw + 'x' + th;
                const cached = hqBgCache.get(srcUrl);
                if (cached && cached.key === key) return cached.url;
                const img = new Image();
                img.decoding = 'async';
                img.src = srcUrl;
                await img.decode();
                const iw = img.naturalWidth, ih = img.naturalHeight;
                if (!iw || !ih) return srcUrl;
                const fit = Math.min(tw / iw, th / ih);
                if (fit >= 1) { hqBgCache.set(srcUrl, { key, url: srcUrl, src: srcUrl }); return srcUrl; } // 縮小不要：原画像をそのまま使う
                const dw = Math.max(1, Math.round(iw * fit)), dh = Math.max(1, Math.round(ih * fit));
                let cur = img, cw = iw, ch = ih;
                // 半分ずつ縮小していくと、一気に縮小するより滑らかで細部が潰れにくい
                while (cw / 2 > dw && ch / 2 > dh) {
                    const nw = Math.round(cw / 2), nh = Math.round(ch / 2);
                    const c = document.createElement('canvas'); c.width = nw; c.height = nh;
                    const cx = c.getContext('2d'); cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
                    cx.drawImage(cur, 0, 0, nw, nh);
                    cur = c; cw = nw; ch = nh;
                }
                const out = document.createElement('canvas'); out.width = dw; out.height = dh;
                const ox = out.getContext('2d'); ox.imageSmoothingEnabled = true; ox.imageSmoothingQuality = 'high';
                ox.drawImage(cur, 0, 0, dw, dh);
                const blob = await new Promise(r => out.toBlob(r, 'image/png'));
                if (!blob) return srcUrl;
                if (cached && cached.url && cached.url !== srcUrl) URL.revokeObjectURL(cached.url);
                const url = URL.createObjectURL(blob);
                hqBgCache.set(srcUrl, { key, url, src: srcUrl });
                return url;
            } catch (e) { console.warn('高画質背景の生成に失敗:', e); return srcUrl; }
        }
        function updateBackgroundSelector() {
            const selector = dom.backgroundSelect;
            selector.innerHTML = '';
            const addOption = (value, text) => { const option = document.createElement('option'); option.value = value; option.textContent = text; selector.appendChild(option); };
            addOption('none', '背景なし');
            if (availableBackgrounds.video) addOption('video', '動画');
            if (availableBackgrounds.image) addOption('image', '画像');
            if (availableBackgrounds.video) { selector.value = 'video'; selectedBackgroundType = 'video'; }
            else if (availableBackgrounds.image) { selector.value = 'image'; selectedBackgroundType = 'image'; }
            else { selector.value = 'none'; selectedBackgroundType = 'none'; }
        }
        // ユーザーが選んだ背景を、ZIP内の背景より優先して使う
        // TJA指定の背景があればそれを優先、無ければ別に用意した背景の種類
        function getPreferredBgType() {
            if (tjaBgSpecified.video && availableBackgrounds.video) return 'video';
            if (tjaBgSpecified.image && availableBackgrounds.image) return 'image';
            return customBg ? customBg.type : selectedBackgroundType;
        }
        function applyCustomBackground(select) {
            if (!customBg) return;
            // TJAで同じ種類の背景が指定されている場合は上書きしない
            if (!tjaBgSpecified[customBg.type]) {
                const old = availableBackgrounds[customBg.type];
                if (old && old !== customBg.url) URL.revokeObjectURL(old);
                availableBackgrounds[customBg.type] = customBg.url;
            }
            updateBackgroundSelector();
            const prefType = getPreferredBgType();
            dom.backgroundSelect.value = prefType;
            selectedBackgroundType = prefType;
            if (select) saveTaikoBeatmapSpecificSettings();
        }
        function bgTypeFromFile(file) {
            const name = (file.name || '').toLowerCase();
            if (file.type && file.type.startsWith('video/')) return 'video';
            if (file.type && file.type.startsWith('image/')) return 'image';
            if (BG_VIDEO_EXTS.some(e => name.endsWith(e))) return 'video';
            if (BG_IMAGE_EXTS.some(e => name.endsWith(e))) return 'image';
            return null;
        }
        function setCustomBackgroundFromBlob(blob, type) {
            if (customBg && customBg.url) {
                if (availableBackgrounds[customBg.type] === customBg.url) availableBackgrounds[customBg.type] = null;
                URL.revokeObjectURL(customBg.url);
            }
            customBg = { type, url: URL.createObjectURL(blob) };
        }
        // --- 背景ライブラリ：動画・画像に名前を付けてたくさん保存し、選んで使う ---
        const LIB_BG_KEY = 'taikoPlayerLibBg';          // 現在選んでいる背景のID
        const LIB_BG_MAP_KEY = 'taikoPlayerLibBgMap';   // 譜面ごとに選んだ背景のID
        let bgLibrary = [];                             // { id, name, type, mime, size }
        let selectedLibBgId = '';
        function getSongBgKeys() { return [getTaikoBeatmapSettingsKey(), getTaikoBeatmapContentKey()].filter(Boolean); }
        function readSongBgMap() { try { return JSON.parse(localStorage.getItem(LIB_BG_MAP_KEY)) || {}; } catch (e) { return {}; } }
        function writeSongBgMap(map) { try { localStorage.setItem(LIB_BG_MAP_KEY, JSON.stringify(map)); } catch (e) { console.warn(e); } }
        function rememberSongBg(id) {
            const keys = getSongBgKeys();
            if (keys.length === 0) return;
            const map = readSongBgMap();

            if (!isAutoPlay) {
