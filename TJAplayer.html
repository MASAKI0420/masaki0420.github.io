                setTimeout(() => {
                    if (runId === gameRunId && isGameRunning && !isPaused && !useWebAudioMusic) dom.audioPlayer.play();
                }, audioPlayDelay);
                if (selectedBackgroundType === 'video' && availableBackgrounds.video && videoResult !== 'video_error') {
                    setTimeout(() => {
                        if (runId === gameRunId && isGameRunning && !isPaused) dom.backgroundVideo.play();
                    }, videoPlayDelay);
                }
                setTimeout(() => { if (runId === gameRunId) isInitialCooldown = false; }, 500 + audioPlayDelay);
            }, initialDelay);
            animationFrameId = requestAnimationFrame(gameLoop);
        }
        // audioContext.currentTime は音声バッファ単位でしか進まないため、そのまま描画に使うと譜面がカクつく。
        // 描画には performance.now() ベースの滑らかな時計を使い、音声時計が更新されるたびにごくわずかずつ追従させる（ドリフトしない・飛ばない）。
        function syncSmoothClock() {
            const c = audioContext.currentTime;
            if (c === lastCtxSample) return;
            lastCtxSample = c;
            if (c < syncGateCtx) return;
            const target = performance.now() - (c - ctxZero) * 1000;
            const nowMs = performance.now();
            const dt = lastSmoothSyncPerf > 0 ? Math.min(100, nowMs - lastSmoothSyncPerf) : 16;
            lastSmoothSyncPerf = nowMs;
            const diff = target - smoothZero;
            const ad = Math.abs(diff);
            if (!smoothSynced || ad > 300) { smoothZero = target; smoothSynced = true; }       // 初回・極端なズレだけ即時合わせ
            else if (ad > 50) { smoothZero += Math.sign(diff) * Math.min(ad, dt * 0.06); }     // 開始直後などの音声時計の飛びは、ワープさせず少しずつ寄せる（カクつき防止）
            else smoothZero += diff * 0.02;
        }
        function getGameTime() {
            if (isPaused) return heldGameTime;
            if (useWebAudioMusic) {
                syncSmoothClock();
                if (clockHeld) {
                    if (audioContext.currentTime >= clockReleaseCtx) clockHeld = false;
                    else return heldGameTime;
                }
                return performance.now() - smoothZero;
            }
            if (clockHeld) return heldGameTime;
            return performance.now() - gameStartTime - totalPauseDuration;
        }
        // 無音のループを一時的に鳴らして音声デバイスを起こしておく（曲の頭で音声時計が飛んで譜面がカクつくのを防ぐ）
        function startAudioKeepAlive(durationMs) {
            try {
                if (!audioContext) return;
                if (keepAliveSource) { try { keepAliveSource.stop(); } catch (e) {} keepAliveSource = null; }
                const buf = audioContext.createBuffer(1, 128, audioContext.sampleRate);
                const src = audioContext.createBufferSource();
                const g = audioContext.createGain();
                g.gain.value = 0;
                src.buffer = buf; src.loop = true;
                src.connect(g); g.connect(audioContext.destination);
                src.start();
                keepAliveSource = src;
                setTimeout(() => { if (keepAliveSource === src) { try { src.stop(); src.disconnect(); g.disconnect(); } catch (e) {} keepAliveSource = null; } }, durationMs);
            } catch (e) { /* 失敗しても再生には影響しない */ }
        }
        // 動画のデコーダ・再生パイプラインをカウントダウン中に起こしておく（再生開始の瞬間の引っかかり防止）
        function prerollBackgroundVideo(videoEl, startSec) {
            try {
                videoEl.muted = true;
                videoEl.style.visibility = 'hidden';
                const p = videoEl.play();
                const finish = () => {
                    try { videoEl.pause(); videoEl.currentTime = startSec; } catch (e) {}
                    videoEl.style.visibility = '';
                };
                if (p && typeof p.then === 'function') p.then(() => setTimeout(finish, 120)).catch(() => { videoEl.style.visibility = ''; });
                else { setTimeout(finish, 120); }
            } catch (e) { videoEl.style.visibility = ''; }
        }
        function stopMusic() {
            if (musicSource) {
                try { musicSource.stop(); } catch (e) {}
                try { musicSource.disconnect(); } catch (e) {}
                musicSource = null;
            }
        }
        // ctxStartSec(audioContext時刻) に譜面時間 gameMsAtStart - audioClockOffsetMs の位置が鳴るように、サンプル精度で予約する
        function scheduleMusic(ctxStartSec, bufPosMs) {
            stopMusic();
            if (!musicBuffer) return;
            const src = audioContext.createBufferSource();
            src.buffer = musicBuffer;
            src.connect(musicGainNode);
            if (bufPosMs >= 0) {
                if (bufPosMs / 1000 < musicBuffer.duration) src.start(ctxStartSec, bufPosMs / 1000);
            } else {
                src.start(ctxStartSec + (-bufPosMs) / 1000, 0);
            }
            musicSource = src;
        }
        async function getMusicBuffer() {
            if (!musicGainNode) {
                musicGainNode = audioContext.createGain();
                musicGainNode.gain.value = parseFloat(dom.musicVolumeSlider.value);
                musicGainNode.connect(audioContext.destination);
            }
            if (musicBuffer && musicBufferSrc === audioSrc) return musicBuffer;
            musicBuffer = null; musicBufferSrc = null;
            const res = await fetch(audioSrc);
            const ab = await res.arrayBuffer();
            const buf = await audioContext.decodeAudioData(ab);
            musicBuffer = buf; musicBufferSrc = audioSrc;
            return buf;
        }
        // 譜面時間を音声の実再生位置に合わせ直す（開始・再開・バッファ待ち復帰時）
        function resyncClockToAudio() {
            const pos = dom.audioPlayer.currentTime * 1000 + audioClockOffsetMs;
            gameStartTime = performance.now() - pos;
            totalPauseDuration = 0;
            heldGameTime = pos;
            clockHeld = false;
            lastAudioPos = -1;
        }
        // 毎フレーム、音声の再生位置と譜面時間の微小なズレを補正する（累積ドリフト防止）
        function correctClockDrift() {
            if (useWebAudioMusic || isPaused || clockHeld) return;
            const a = dom.audioPlayer;
            if (a.paused || a.ended || a.seeking) return;
            const pos = a.currentTime;
            if (pos === lastAudioPos) return;
            lastAudioPos = pos;
            const diff = (pos * 1000 + audioClockOffsetMs) - getGameTime();
            if (Math.abs(diff) > 30) gameStartTime -= diff;
            else gameStartTime -= diff * 0.05;
        }
        function updateLastCheckedNoteIndex() { while(hitObjects[lastCheckedNoteIndex] && hitObjects[lastCheckedNoteIndex].judged) { lastCheckedNoteIndex++; } }

        // --- 譜面分岐ロジック ---
        const BRANCH_LABELS = { N: '普通譜面', E: '玄人譜面', M: '達人譜面' };
        // 共通部分('C')か、選ばれた分岐に属するものだけが有効
        function isNoteActive(item) {
            return item.branch === undefined || item.branch === 'C' || regionChoice[item.region] === item.branch;
        }
        // 希望の分岐が存在しなければ 達人→玄人→普通 の順で下位に落とす
        function resolveBranch(region, desired) {
            const has = region.has || { N: true, E: false, M: false };
            const order = desired === 'M' ? ['M', 'E', 'N'] : (desired === 'E' ? ['E', 'N'] : ['N']);
            for (const b of order) { if (has[b]) return b; }
            for (const b of ['N', 'E', 'M']) { if (has[b]) return b; }
            return 'N';
        }
        function updateBranchIndicator(animate) {
            const el = dom.branchIndicator;
            if (!el) return;
            if (branchRegions.length === 0) { el.style.display = 'none'; return; }
            el.style.display = 'block';
            el.textContent = BRANCH_LABELS[currentBranch] || '';
            el.className = 'branch-' + currentBranch;
            if (animate) { el.style.animation = 'none'; void el.offsetHeight; el.style.animation = null; }
        }
        function resetSectionStats() {
            sectionBase = { ryo: judgmentCounts.ryo, ka: judgmentCounts.ka, fuka: judgmentCounts.fuka, roll: totalRollHits, score: score };
        }
        function initBranchState() {
            regionChoice = branchRegions.map(r => resolveBranch(r, 'N'));
            nextBranchIdx = 0;
            nextSectionIdx = 0;
            totalRollHits = 0;
            currentBranch = 'N';
            sectionBase = { ryo: 0, ka: 0, fuka: 0, roll: 0, score: 0 };
            updateBranchIndicator(false);
        }
        // 分岐の判定時刻：分岐先のノーツが画面に入る前に決める（直前の#SECTION以降）
        function getBranchDecisionTime(region) {
            const speed = Math.max(Math.abs(region.scroll) * (uiScrollSpeed * 0.1), 0.05);
            const travel = (dom.canvas.width - JUDGE_POINT_X + 100) / speed;
            let t = region.time - travel;
            // 分岐開始と同時刻の#SECTIONは「数える範囲が0」になるため無視する
            for (let i = sectionPoints.length - 1; i >= 0; i--) {
                if (sectionPoints[i].time < region.time - 1) { t = Math.max(t, sectionPoints[i].time); break; }
            }
            return Math.min(t, region.time);
        }
        function decideBranch(idx, region) {
            let chosen;
            const held = levelHoldPoints.some(p => p.time <= region.time + 1);
            if (held) {
                // #LEVELHOLD 以降は現在の譜面を維持
                chosen = resolveBranch(region, currentBranch);
            } else {
                let value;
                if (region.type === 'r') {
                    value = totalRollHits - sectionBase.roll;
                } else if (region.type === 's') {
                    value = score - sectionBase.score;
                } else {
                    const ryo = judgmentCounts.ryo - sectionBase.ryo;
                    const ka = judgmentCounts.ka - sectionBase.ka;
                    const fuka = judgmentCounts.fuka - sectionBase.fuka;
                    const total = ryo + ka + fuka;
                    value = total > 0 ? ((ryo + ka * 0.5) / total) * 100 : 0;
                }
                const EPS = 1e-9;
                let desired = 'N';
                if (value + EPS >= region.mThr) desired = 'M';
                else if (value + EPS >= region.eThr) desired = 'E';
                chosen = resolveBranch(region, desired);
            }
            regionChoice[idx] = chosen;
            // 選ばれなかった分岐のノーツは以後無効にする
            for (const note of hitObjects) {
                if (note.region === idx && note.branch !== 'C' && note.branch !== chosen) {
                    note.judged = true;
                    note.sePlayed = true;
                }
            }
            const changed = chosen !== currentBranch;
            currentBranch = chosen;
            updateBranchIndicator(changed);
            resetSectionStats();
        }
        function updateBranches(elapsedTime) {
            if (branchRegions.length === 0) return;
            const processSections = () => {
                const limit = nextBranchIdx < branchRegions.length ? branchRegions[nextBranchIdx].time - 1 : Infinity;
                while (nextSectionIdx < sectionPoints.length
                       && sectionPoints[nextSectionIdx].time <= elapsedTime
                       && sectionPoints[nextSectionIdx].time < limit) {
                    resetSectionStats();
                    nextSectionIdx++;
                }
            };
            processSections();
            while (nextBranchIdx < branchRegions.length) {
                const region = branchRegions[nextBranchIdx];
                if (elapsedTime < getBranchDecisionTime(region)) break;
                decideBranch(nextBranchIdx, region);
                nextBranchIdx++;
                processSections();
            }
        }
        
        function drawCapsule(ctx, x1, x2, y, radius, color) {
            if (x1 > x2)[x1, x2] = [x2, x1]; 
            ctx.beginPath();
            ctx.arc(x1, y, radius, Math.PI / 2, -Math.PI / 2);
            ctx.arc(x2, y, radius, -Math.PI / 2, Math.PI / 2);
            ctx.closePath();
            if (color) {
                ctx.fillStyle = color;
                ctx.fill();
            }
        }

        function gameLoop() {
            if (!isGameRunning) return;
            animationFrameId = requestAnimationFrame(gameLoop);
            if (isPaused) return;
            correctClockDrift();
            const elapsedTime = getGameTime() - offset;
            updateBranches(elapsedTime);
            isGoGoNow = false;
            for (const section of goGoSections) {
                if (elapsedTime >= section.start && elapsedTime < section.end && isNoteActive(section)) {
                    isGoGoNow = true;
                    break;
                }
            }
            dom.ctx.clearRect(0, 0, dom.canvas.width, dom.canvas.height);
            
            drawJudgmentFrame();
            if (isGoGoNow) {
                drawGameArea(true);
            }

            if (laneCoverPercentage > 0) {
                const visibleWidth = dom.canvas.width * (1 - laneCoverPercentage / 100);
                dom.ctx.save();
                dom.ctx.beginPath();
                dom.ctx.rect(0, 0, visibleWidth, dom.canvas.height);
                dom.ctx.clip();
            }

            drawBarLines(elapsedTime);
            drawNotes(elapsedTime);

            if (laneCoverPercentage > 0) {
                dom.ctx.restore();
            }

            drawRollCounter(elapsedTime);
            if (isAutoPlay) {
                autoPlayHandler(elapsedTime);
            } else {
                checkMisses(elapsedTime);
                if (isAutoSE) {
                    autoSEHandler(elapsedTime);
                }
            }
            updateLastCheckedNoteIndex();
            const progress = Math.min(1, elapsedTime / lastNoteTime);
            drawProgressPie('taiko-gameplay-progress-pie', progress);
            if (progress >= 1 && elapsedTime > lastNoteTime + 3000) {
                showResults();
            }
        }

        function drawJudgmentFrame() {
            const y = dom.canvas.height / 2;
            const ctx = dom.ctx;
            const normalNoteRadius = (dom.canvas.height / 2) * 0.41;
            const bigNoteRadius = (dom.canvas.height / 2) * 0.65;
            const centerCircleRadius = (dom.canvas.height / 2) * 0.35;

            ctx.strokeStyle = '#666666';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(JUDGE_POINT_X, y, bigNoteRadius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = '#CCCCCC';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(JUDGE_POINT_X, y, normalNoteRadius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#777777';
            ctx.beginPath();
            ctx.arc(JUDGE_POINT_X, y, centerCircleRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGameArea(isGoGo) {
            if (isGoGo) {
                const fireGradient = dom.ctx.createLinearGradient(0, 0, 0, dom.canvas.height);
                fireGradient.addColorStop(0, "rgba(255, 100, 0, 0.3)");
                fireGradient.addColorStop(0.5, "rgba(255, 69, 0, 0.2)");
                fireGradient.addColorStop(1, "rgba(255, 100, 0, 0.3)");
                dom.ctx.fillStyle = fireGradient;
                dom.ctx.fillRect(0, 0, dom.canvas.width, dom.canvas.height);
            }
        }
        function drawBarLines(elapsedTime) {
            const pixelMultiplier = uiScrollSpeed * 0.1;
            dom.ctx.strokeStyle = '#FFFFFF';
            dom.ctx.lineWidth = 2;
            dom.ctx.globalAlpha = 0.5;
            barLines.forEach(line => {
                if (!isNoteActive(line)) return;
                const timeToJudge = line.time - elapsedTime;
                const x = JUDGE_POINT_X + timeToJudge * line.scrollSpeed * pixelMultiplier;
                if (x < JUDGE_POINT_X - 50) return;
                dom.ctx.beginPath();
                dom.ctx.moveTo(x, 0);
                dom.ctx.lineTo(x, dom.canvas.height);
                dom.ctx.stroke();
            });
            dom.ctx.globalAlpha = 1.0;
        }
        
        function drawNotes(elapsedTime) {
            const y = dom.canvas.height / 2;
            const pixelMultiplier = uiScrollSpeed * 0.1;
            const BEIGE_RING = '#F0EAD6';
            const BLACK_BORDER = '#000000';

            // 太鼓(ドラム)アイコンの中心より左は描画しない。音符は太鼓の下に潜り込んだ状態で見えなくなる。
            // ドラム中心X = 180px + --ui-offset-x、判定枠X = 390px + --ui-offset-x なので差は常に210px
            const DRUM_CENTER_X = JUDGE_POINT_X - 210;
            dom.ctx.save();
            dom.ctx.beginPath();
            dom.ctx.rect(DRUM_CENTER_X, 0, dom.canvas.width - DRUM_CENTER_X, dom.canvas.height);
            dom.ctx.clip();

            for (let i = hitObjects.length - 1; i >= 0; i--) {
                const note = hitObjects[i];

                // 見逃した音符・通り過ぎた連打/風船は、画面の左端まで流し切る
                if ((note.judged && !note.missed && !note.passed) || !isNoteActive(note)) continue;
                // オート時：叩く瞬間（elapsedTime >= note.time）のフレームでは、音符を必ず判定枠の中心に止めて描画する
                // （叩く処理は描画の後に走るため、補正しないと1フレーム分だけ判定枠を通り過ぎた位置で消える）
                const timeToJudge = (isAutoPlay && (note.type === 'don' || note.type === 'katsu'))
                    ? Math.max(0, note.time - elapsedTime)
                    : note.time - elapsedTime;
                const startX = JUDGE_POINT_X + timeToJudge * note.scrollSpeed * pixelMultiplier;

                if (note.type === 'roll') {
                    const timeToEnd = note.endTime - elapsedTime;
                    const endX = JUDGE_POINT_X + timeToEnd * note.scrollSpeed * pixelMultiplier;
                    if (endX < -150 || startX > dom.canvas.width + 50) continue;

                    const barHeight = note.isBig ? y * 0.8 : y * 0.8;
                    const headRadius = barHeight / 2;
                    const BAR_THICKNESS_SCALE = 1.046;
                    const barRadius = headRadius * BAR_THICKNESS_SCALE;
                    
                    const BLACK_BORDER_THICKNESS = 2;
                    const WHITE_BORDER_THICKNESS = 6;

                    drawCapsule(dom.ctx, startX, endX, y, barRadius, BLACK_BORDER);
                    drawCapsule(dom.ctx, startX, endX, y, barRadius - BLACK_BORDER_THICKNESS, BEIGE_RING);
                    drawCapsule(dom.ctx, startX, endX, y, barRadius - BLACK_BORDER_THICKNESS - WHITE_BORDER_THICKNESS, '#FFC700');

                    dom.ctx.fillStyle = BLACK_BORDER;
                    dom.ctx.beginPath();
                    dom.ctx.arc(startX, y, headRadius, 0, Math.PI * 2);
                    dom.ctx.fill();

                    dom.ctx.fillStyle = BEIGE_RING;
                    dom.ctx.beginPath();
                    dom.ctx.arc(startX, y, headRadius - BLACK_BORDER_THICKNESS, 0, Math.PI * 2);
                    dom.ctx.fill();

                    dom.ctx.fillStyle = '#FFC700';
                    dom.ctx.beginPath();
                    dom.ctx.arc(startX, y, headRadius - BLACK_BORDER_THICKNESS - WHITE_BORDER_THICKNESS, 0, Math.PI * 2);
                    dom.ctx.fill();
                

                } else if (note.type === 'balloon') {
                     const timeToEnd = note.endTime - elapsedTime;
                    const endX = JUDGE_POINT_X + timeToEnd * note.scrollSpeed * pixelMultiplier;
                    
                    const radius = y * 0.45; 
                    let currentX = startX;
                    if (startX < JUDGE_POINT_X && endX > JUDGE_POINT_X) {
                        currentX = JUDGE_POINT_X;
                    }
                    if (currentX < -radius) continue;

                    const BLACK_BORDER_THICKNESS = 2;
                    const WHITE_BORDER_THICKNESS = 6;
                    const ORANGE_FILL = '#F98025';

                    dom.ctx.fillStyle = BLACK_BORDER;
                    dom.ctx.beginPath();
                    dom.ctx.arc(currentX, y, radius, 0, Math.PI * 2);
                    dom.ctx.fill();

                    dom.ctx.fillStyle = BEIGE_RING;
                    dom.ctx.beginPath();
                    dom.ctx.arc(currentX, y, radius - BLACK_BORDER_THICKNESS, 0, Math.PI * 2);
                    dom.ctx.fill();

                    dom.ctx.fillStyle = ORANGE_FILL;
                    dom.ctx.beginPath();
                    dom.ctx.arc(currentX, y, radius - BLACK_BORDER_THICKNESS - WHITE_BORDER_THICKNESS, 0, Math.PI * 2);
                    dom.ctx.fill();
                    
                    const remainingHits = note.hitsRequired - note.hitsMade;
                    if (remainingHits > 0) {
                        dom.ctx.fillStyle = '#fff';
                        dom.ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                        dom.ctx.lineWidth = 4;
                        dom.ctx.font = `bold ${radius}px sans-serif`;
                        dom.ctx.textAlign = 'center';
                        dom.ctx.textBaseline = 'middle';
                        dom.ctx.strokeText(remainingHits, currentX, y);
                        dom.ctx.fillText(remainingHits, currentX, y);
                    }

                } else { 
                    if (startX > dom.canvas.width + 50 || startX < -(note.isBig ? y * 0.65 : y * 0.42) - 10) continue;
                    
                    const color = note.type === 'don' ? '#F83838' : '#46B6B6';
                    const baseRadius = note.isBig ? y * 0.65 : y * 0.42;
                    
                    const BLACK_BORDER_THICKNESS = 2;
                    const WHITE_BORDER_THICKNESS = 6;

                    dom.ctx.fillStyle = BLACK_BORDER;
                    dom.ctx.beginPath();
                    dom.ctx.arc(startX, y, baseRadius, 0, Math.PI * 2);
                    dom.ctx.fill();

                    dom.ctx.fillStyle = BEIGE_RING;
                    dom.ctx.beginPath();
                    dom.ctx.arc(startX, y, baseRadius - BLACK_BORDER_THICKNESS, 0, Math.PI * 2);
                    dom.ctx.fill();

                    dom.ctx.fillStyle = color;
                    dom.ctx.beginPath();
                    dom.ctx.arc(startX, y, baseRadius - BLACK_BORDER_THICKNESS - WHITE_BORDER_THICKNESS, 0, Math.PI * 2);
                    dom.ctx.fill();
                }
            }
            dom.ctx.restore();
        }
        function drawRollCounter(elapsedTime) { if (rollCounterClearTime > 0 && elapsedTime >= rollCounterClearTime) { activeRollHits = 0; rollCounterClearTime = 0; } if (activeRollHits > 0) { dom.rollCounterDisplay.textContent = activeRollHits; dom.rollCounterDisplay.classList.add('visible'); } else { dom.rollCounterDisplay.classList.remove('visible'); } }
        
        function playHitSound(type, offset) {
            if (offset === undefined) offset = parseInt(dom.seOffsetInput.value, 10) || 0; // SEオフセット(ms): 正=遅らせる / 負=頭を削って早める
            if (!audioContext) return;
            const buffer = (type === 'don') ? donSoundBuffer : katsuSoundBuffer;
            if (!buffer) return;
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(seGainNode);
            const offsetInSeconds = offset / 1000;
            let playTime = audioContext.currentTime;
            let playOffset = 0;
            if (offsetInSeconds >= 0) {
                playTime += offsetInSeconds;
            } else {
                playOffset = -offsetInSeconds;
            }
            if (playOffset < buffer.duration) {
                source.start(playTime, playOffset);
            }
        }
        function autoSEHandler(elapsedTime) { for (let i = lastAutoSEIndex; i < hitObjects.length; i++) { const note = hitObjects[i]; if (!isNoteActive(note)) { if (elapsedTime >= note.time) note.sePlayed = true; continue; } if (note.sePlayed) continue; if (elapsedTime >= note.time) { if (note.type === 'don' || note.type === 'katsu') { playHitSound(note.type); note.sePlayed = true; } } else { break; } } while(hitObjects[lastAutoSEIndex] && hitObjects[lastAutoSEIndex].sePlayed) { lastAutoSEIndex++; } }
        function showHitError(diff) {
            if (!dom.errorBar) return;
            const tick = document.createElement('div');
            tick.className = 'error-tick';
            const percentage = (diff + HIT_WINDOW_BAD) / (HIT_WINDOW_BAD * 2) * 100;
            tick.style.left = `${Math.max(0, Math.min(100, percentage))}%`;
            dom.errorBar.appendChild(tick);
            setTimeout(() => {
                if (tick.parentNode) {
                    tick.remove();
                }

        function updatePauseSelection() { const buttons = dom.pauseOverlay.querySelectorAll('.overlay-button'); buttons.forEach((btn, index) => { btn.classList.toggle('selected', index === selectedPauseIndex); }); }
        
        function togglePause() { 
            if (isInitialCooldown || !isGameRunning || isPauseButtonCoolingDown) return; 
            isPauseButtonCoolingDown = true; setTimeout(() => { isPauseButtonCoolingDown = false; }, 500); 
            if (!isPaused) { 
                // 停止した瞬間の譜面時間をそのまま保持（音声の currentTime には依存しない）
                heldGameTime = getGameTime();
                clockHeld = false;
                isPaused = true; 
                pauseStartTime = performance.now(); 
                pausedTime = dom.audioPlayer.currentTime;
                stopMusic();
                dom.audioPlayer.pause(); 
                if (selectedBackgroundType === 'video' && availableBackgrounds.video) dom.backgroundVideo.pause(); 
                dom.gameContainer.classList.remove('playing'); 
                cancelAnimationFrame(animationFrameId); 
                dom.pauseOverlay.style.display = 'flex'; 
                selectedPauseIndex = 0; 
                updatePauseSelection(); 
            } else { 
                const runId = gameRunId;
                const audioTargetMs = heldGameTime - audioClockOffsetMs;
                isPaused = false; 
                if (useWebAudioMusic) {
                    // 再開位置を audioContext 時刻で予約。譜面時間も同じ時計から算出するので、一時停止前後で音と譜面の相対位置は変わらない
                    if (audioContext.state === 'suspended') audioContext.resume();
                    const lead = 0.12;
                    const ctxStart = audioContext.currentTime + lead;
                    ctxZero = ctxStart - heldGameTime / 1000;
                    smoothSynced = false; lastCtxSample = -1;
                    clockReleaseCtx = ctxStart;
                    clockHeld = true;
                    scheduleMusic(ctxStart, heldGameTime - audioClockOffsetMs);
                } else if (audioTargetMs >= 0) {
                    // 音声が実際に鳴り始めるまで譜面時間を固定し、鳴り始めた位置に合わせて再開する
                    clockHeld = true;
                    dom.audioPlayer.currentTime = audioTargetMs / 1000;
                    const releaseFallback = setTimeout(() => {
                        if (runId === gameRunId && clockHeld) {
                            gameStartTime = performance.now() - heldGameTime; totalPauseDuration = 0; clockHeld = false; lastAudioPos = -1;
                        }
                    }, 2000);
                    const p = dom.audioPlayer.play();
                    if (p && p.catch) p.catch(() => {
                        clearTimeout(releaseFallback);
                        if (runId === gameRunId && clockHeld) {
                            gameStartTime = performance.now() - heldGameTime; totalPauseDuration = 0; clockHeld = false; lastAudioPos = -1;
                        }
                    });
                } else {
                    // 音声の再生開始前に止めた場合：譜面時間をその地点から進め、音声は予定時刻に開始
                    clockHeld = false;
                    gameStartTime = performance.now() - heldGameTime; totalPauseDuration = 0; lastAudioPos = -1;
                    dom.audioPlayer.currentTime = 0;
                    setTimeout(() => { if (runId === gameRunId && isGameRunning && !isPaused) dom.audioPlayer.play(); }, -audioTargetMs);
                }
                if (selectedBackgroundType === 'video' && availableBackgrounds.video) dom.backgroundVideo.play(); 
                dom.gameContainer.classList.add('playing'); 
                animationFrameId = requestAnimationFrame(gameLoop); 
                dom.pauseOverlay.style.display = 'none'; 
            } 
        }

        document.addEventListener('keydown', e => {
            if (activeGame === 'taiko') {
                if (isPaused) {
                    const buttons = dom.pauseOverlay.querySelectorAll('.overlay-button');
                    if (buttons.length === 0) return;

                    switch (e.key) {
                        case 'ArrowUp':
                            e.preventDefault();
                            selectedPauseIndex = (selectedPauseIndex - 1 + buttons.length) % buttons.length;
                            updatePauseSelection();
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            selectedPauseIndex = (selectedPauseIndex + 1) % buttons.length;
                            updatePauseSelection();
                            break;
                        case 'Enter':
                            e.preventDefault();
                            buttons[selectedPauseIndex].click();
                            break;
                        case 'ArrowLeft':
                        case 'ArrowRight':
                            e.preventDefault(); 
                            break;
                    }
                } else if (dom.resultsOverlay.style.display === 'flex') {
                    const rButtons = dom.resultsOverlay.querySelectorAll('.overlay-button');
                    if (rButtons.length === 0) return;
                    switch (e.key) {
                        case 'ArrowUp':
                            e.preventDefault();
                            selectedResultsIndex = (selectedResultsIndex - 1 + rButtons.length) % rButtons.length;
                            updateResultsSelection();
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            selectedResultsIndex = (selectedResultsIndex + 1) % rButtons.length;
                            updateResultsSelection();
                            break;
                        case 'Enter':
                            e.preventDefault();
                            rButtons[selectedResultsIndex].click();
                            break;
                        case 'ArrowLeft':
                        case 'ArrowRight':
                            e.preventDefault();
                            break;
                    }
                } else if (isGameRunning && e.code === 'Space') {
                    e.preventDefault();
                } else if (!isGameRunning && e.code === 'Space' && !dom.startButton.disabled) {
                    e.preventDefault();
                    startGame();
                }
            }
        });

        function retryGame() { 
            gameRunId++; clockHeld = false; stopMusic();
            isGameRunning = false; 
            if(animationFrameId) cancelAnimationFrame(animationFrameId); 
            dom.audioPlayer.pause(); 
            dom.audioPlayer.load();
            if (selectedBackgroundType === 'video' && dom.backgroundVideo) dom.backgroundVideo.pause(); 
            dom.pauseOverlay.style.display = 'none'; 
            dom.resultsOverlay.style.display = 'none'; 
            if (beatmapLoaded && audioLoaded) { 
                startGame(); 
            } else { 
                returnToControls(); 
            } 
        }
        function returnToControls() {
            gameRunId++; clockHeld = false; stopMusic();
            isGameRunning = false;
            isPaused = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
            if (dom.audioPlayer) {
                dom.audioPlayer.pause();
                dom.audioPlayer.currentTime = 0;
            }
            if (selectedBackgroundType === 'video' && dom.backgroundVideo) {
                dom.backgroundVideo.pause();
                dom.backgroundVideo.load();
                dom.backgroundVideo.currentTime = 0;
            }
            dom.pauseOverlay.style.display = 'none';
            dom.resultsOverlay.style.display = 'none';
            dom.gameContainer.classList.remove('playing');
            dom.gameContainer.style.display = 'none';
            dom.appContainer.style.display = 'flex';
            resetGame();
        }
        function showResults() { 
            if(!isGameRunning && dom.resultsOverlay.style.display === 'flex') return;
            playEndTime = getGameTime();
            isGameRunning = false; 
            cancelAnimationFrame(animationFrameId); 
            dom.gameContainer.classList.remove('playing'); 
            const totalHits = judgmentCounts.ryo + judgmentCounts.ka + judgmentCounts.fuka; 
            let finalAccuracy = 100; 
            if (totalHits > 0) { const accVal = (judgmentCounts.ryo * 300 + judgmentCounts.ka * 150) / (totalHits * 300); finalAccuracy = accVal * 100; } 
            let rank = 'S'; 
            if (finalAccuracy < 95) rank = 'A'; 
            if (finalAccuracy < 90) rank = 'B'; 
            if (finalAccuracy < 80) rank = 'C'; 
            if (finalAccuracy < 70) rank = 'D'; 
            setSongTitleDisplay(dom.resultsSongTitle, songInfo.title, songInfo.subtitle, ` - ${songInfo.version}`); 
            dom.resultsScoreValue.textContent = Math.floor(score); 
            dom.resultsRankValue.textContent = rank; 
            dom.resultsMaxComboValue.textContent = maxCombo; 
            dom.resultsRyoValue.textContent = judgmentCounts.ryo; 
            dom.resultsKaValue.textContent = judgmentCounts.ka; 
            dom.resultsFukaValue.textContent = judgmentCounts.fuka; 
            const gaugeCleared = isGaugeCleared();
            const isFullCombo = totalHits > 0 && judgmentCounts.fuka === 0;
            const isAllPerfect = isFullCombo && judgmentCounts.ka === 0;
            if (isAllPerfect) {
                dom.resultsClearStatus.textContent = 'ALLPERFECT';
                dom.resultsClearStatus.className = 'allperfect';
            } else if (isFullCombo) {
                dom.resultsClearStatus.textContent = 'FULLCOMBO';
                dom.resultsClearStatus.className = 'fullcombo';
            } else {
                dom.resultsClearStatus.textContent = gaugeCleared ? 'CLEAR' : 'FAILED';
                dom.resultsClearStatus.className = gaugeCleared ? 'clear' : 'failed';
            }

            selectedResultsIndex = 0;
            updateResultsSelection();
            dom.resultsOverlay.style.display = 'flex'; 
            if (selectedBackgroundType === 'video') dom.backgroundVideo.pause(); 
        }
        async function saveSongToPc() {
            const songId = dom.savedSongsList.value;
            if (!songId) {
                alert('PCに保存する譜面を「保存済み譜面」から選択してください。');
                return;
            }
            dom.saveSongToPcButton.textContent = '準備中...';
            dom.saveSongToPcButton.disabled = true;
            try {
                const blob = await db.getSongBlob(songId);
                if (!blob) throw new Error('Blob data not found in DB.');

                const fileName = songId.substring(songId.indexOf('-') + 1);

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (err) {
                alert('ファイルの保存に失敗しました。');
                console.error('Failed to save .zip file from Taiko player:', err);
            } finally {
                dom.saveSongToPcButton.textContent = 'PCへ保存';
                dom.saveSongToPcButton.disabled = !dom.savedSongsList.value;
            }
        }
        function applyMusicVolume(value) {
            dom.audioPlayer.volume = value;
            if (musicGainNode) musicGainNode.gain.value = value;
            dom.musicVolumeLabel.textContent = Math.round(value * 100);
        }
        function applySEVolume(value) {
            if (seGainNode) {
                seGainNode.gain.value = value;
            }
            dom.seVolumeLabel.textContent = Math.round(value * 100);
        }

        return {
            initialize: async function() {
                initAudioContext(); 
                initKeyConfig();
                setupFileListeners();
                loadSettings();
                updateLaneOpacity();
                updateBgBrightness();
                updateLaneCover();
                dom.startButton.addEventListener('click', startGame);
                dom.speedSlider.addEventListener('input', () => {
                    updateSpeed();
                    saveTaikoBeatmapSpecificSettings();
                });
                dom.offsetInput.addEventListener('change', saveSettings);
                dom.videoOffsetInput.addEventListener('change', saveTaikoBeatmapSpecificSettings);
                dom.videoOffsetInput.addEventListener('input', saveTaikoBeatmapSpecificSettings);
                dom.seOffsetInput.addEventListener('change', saveSettings);
                dom.autoPlayCheckbox.addEventListener('change', saveSettings);
                dom.singleHandBigNoteCheckbox.addEventListener('change', saveSettings);
                dom.autoSeCheckbox.addEventListener('change', saveSettings);
                dom.individualOffsetInput.addEventListener('change', saveTaikoBeatmapSpecificSettings);
                dom.saveSongToPcButton.addEventListener('click', saveSongToPc);
                dom.resumeButton.addEventListener('click', togglePause);
                // 音声が実際に鳴り始めた（開始・再開・バッファ復帰）時点で譜面時間を音声位置に合わせる
                dom.audioPlayer.addEventListener('playing', () => { if (isGameRunning && !isPaused && !useWebAudioMusic) resyncClockToAudio(); });
                dom.retryButton.addEventListener('click', retryGame);
                dom.backToTitlePause.addEventListener('click', returnToControls);
                dom.resultsRetryButton.addEventListener('click', retryGame);
                dom.backToTitleResults.addEventListener('click', returnToControls);
                dom.laneOpacitySlider.addEventListener('input', () => { updateLaneOpacity(); saveSettings(); });
                dom.bgBrightnessSlider.addEventListener('input', () => { updateBgBrightness(); saveSettings(); });
                dom.laneCoverSlider.addEventListener('input', () => { updateLaneCover(); saveSettings(); });
                dom.backgroundSelect.addEventListener('change', e => { selectedBackgroundType = e.target.value; saveTaikoBeatmapSpecificSettings(); });
                dom.musicVolumeSlider.addEventListener('input', e => { applyMusicVolume(e.target.value); saveSettings(); });
                dom.seVolumeSlider.addEventListener('input', e => { applySEVolume(e.target.value); saveSettings(); });
                dom.uiOffsetSlider.addEventListener('input', () => { updateUiOffset(); saveSettings(); });

                window.addEventListener('resize', initGameUI);
                try {
                    await db.init();
                    await loadSavedSongsList();
                    await loadDefaultSounds();
                    await loadCustomBackground();
                } catch (e) {
                    console.error('Application initialization failed:', e);
                    alert('データベースの初期化に失敗しました。保存機能は利用できません。');
                }
                initializeShortcutKeySetup('taiko-shortcut-retry', 'taiko-shortcut-menu');
            },
            togglePauseExternal: togglePause,
            retryGameExternal: function() {
                if (isGameRunning || isPaused || dom.resultsOverlay.style.display === 'flex') {
                    retryGame();
                }
            },
            returnToControlsExternal: function() { 
                if (isGameRunning || isPaused || dom.resultsOverlay.style.display === 'flex') {
                    returnToControls();
                }
            }
        };
    })();

    </script>
