                        dom.backgroundSelect.value = customBg.type;
                    } else if (availableBackgrounds.video) {
                        dom.backgroundSelect.value = 'video';
                    } else if (availableBackgrounds.image) {
                        dom.backgroundSelect.value = 'image';
                    }
                    selectedBackgroundType = dom.backgroundSelect.value;
                    saveTaikoBeatmapSpecificSettings();
                }

                // --- 音声ファイルの検索処理 ---
                let audioFileEntry = null;

                if (osz_zip) {
                    // 1. TJAのWAVE指定の名前で検索（拡張子抜きで比較）
                    if (songInfo.audioFilename) {
                        let targetAudioName = songInfo.audioFilename.replace(/\\/g, '/').toLowerCase();
                        targetAudioName = targetAudioName.replace(/^["']|["']$/g, '').trim();
                        const targetBasename = targetAudioName.split('/').pop();
                        // 拡張子がある場合のみ取り除く
                        const targetNoExt = targetBasename.includes('.') ? targetBasename.substring(0, targetBasename.lastIndexOf('.')) : targetBasename;

                        audioFileEntry = Object.values(osz_zip.files).find(file => {
                            if (file.dir) return false;
                            const name = file.name.replace(/\\/g, '/').toLowerCase();
                            const basename = name.split('/').pop();
                            const nameNoExt = basename.includes('.') ? basename.substring(0, basename.lastIndexOf('.')) : basename;
                            
                            return nameNoExt === targetNoExt && 
                                   (name.endsWith('.mp3') || name.endsWith('.ogg') || name.endsWith('.wav'));
                        });
                    }

                    // 2. 見つからない場合(SJIS文字化けやWAVE指定ミス)は、ZIP内の音声ファイルを適当に1つ探す
                    if (!audioFileEntry) {
                        audioFileEntry = Object.values(osz_zip.files).find(file => {
                            if (file.dir) return false;
                            const name = file.name.toLowerCase();
                            return name.endsWith('.mp3') || name.endsWith('.ogg') || name.endsWith('.wav');
                        });
                    }

                    // 音声が見つかったら読み込む
                    if (audioFileEntry) {
                        try {
                            const audioBlob = await audioFileEntry.async('blob');
                            if (audioSrc) URL.revokeObjectURL(audioSrc);
                            audioSrc = URL.createObjectURL(audioBlob);
                            dom.audioPlayer.src = audioSrc;
                            audioLoaded = true;
                        } catch (e) {
                            alert(`音声ファイルの読み込みに失敗しました。`);
                        }
                    } else {
                        alert(`ZIP内に音声ファイルが見つかりません。`);
                    }
                }

            } else {
                beatmapLoaded = false;
                audioLoaded = false;
                dom.songTitleElement.textContent = '非対応の譜面です';
                dom.songArtistElement.textContent = '太鼓さん次郎の難易度を選択してください';
                alert('この譜面の解析に失敗しました。');
            }
            checkReadyState();
        }

        function checkReadyState() { dom.startButton.disabled = !(beatmapLoaded && audioLoaded); }
        // --- 背景画像の高画質表示 ---
        // 画面より大きい画像をブラウザの標準縮小に任せると荒く（ジャギー）見えるため、
        // 高品質スムージング＋段階的な縮小で画面の実ピクセルサイズに合わせてから表示する
        const hqBgCache = new Map(); // 元URL -> { key, url }
        function clearHqBgCache() { hqBgCache.forEach(v => { if (v.url && v.url !== v.src) URL.revokeObjectURL(v.url); }); hqBgCache.clear(); }
        async function getHqBgUrl(srcUrl) {
            try {
                const dpr = window.devicePixelRatio || 1;
                const tw = Math.max(1, Math.round(window.innerWidth * dpr));
                const th = Math.max(1, Math.round(window.innerHeight * dpr));
                const key = tw + 'x' + th;
                const cached = hqBgCache.get(srcUrl);
                if (cached && cached.key === key) return cached.url;
                const img = new Image();
                img.decoding = 'async';
                img.src = srcUrl;
                await img.decode();
                const iw = img.naturalWidth, ih = img.naturalHeight;
                if (!iw || !ih) return srcUrl;
                const fit = Math.min(tw / iw, th / ih);
                if (fit >= 1) { hqBgCache.set(srcUrl, { key, url: srcUrl, src: srcUrl }); return srcUrl; } // 縮小不要：原画像をそのまま使う
                const dw = Math.max(1, Math.round(iw * fit)), dh = Math.max(1, Math.round(ih * fit));
                let cur = img, cw = iw, ch = ih;
                // 半分ずつ縮小していくと、一気に縮小するより滑らかで細部が潰れにくい
                while (cw / 2 > dw && ch / 2 > dh) {
                    const nw = Math.round(cw / 2), nh = Math.round(ch / 2);
                    const c = document.createElement('canvas'); c.width = nw; c.height = nh;
                    const cx = c.getContext('2d'); cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
                    cx.drawImage(cur, 0, 0, nw, nh);
                    cur = c; cw = nw; ch = nh;
                }
                const out = document.createElement('canvas'); out.width = dw; out.height = dh;
                const ox = out.getContext('2d'); ox.imageSmoothingEnabled = true; ox.imageSmoothingQuality = 'high';
                ox.drawImage(cur, 0, 0, dw, dh);
                const blob = await new Promise(r => out.toBlob(r, 'image/png'));
                if (!blob) return srcUrl;
                if (cached && cached.url && cached.url !== srcUrl) URL.revokeObjectURL(cached.url);
                const url = URL.createObjectURL(blob);
                hqBgCache.set(srcUrl, { key, url, src: srcUrl });
                return url;
            } catch (e) { console.warn('高画質背景の生成に失敗:', e); return srcUrl; }
        }
        function updateBackgroundSelector() {
            const selector = dom.backgroundSelect;
            selector.innerHTML = '';
            const addOption = (value, text) => { const option = document.createElement('option'); option.value = value; option.textContent = text; selector.appendChild(option); };
            addOption('none', '背景なし');
            if (availableBackgrounds.video) addOption('video', '動画');
            if (availableBackgrounds.image) addOption('image', '画像');
            if (availableBackgrounds.video) { selector.value = 'video'; selectedBackgroundType = 'video'; }
            else if (availableBackgrounds.image) { selector.value = 'image'; selectedBackgroundType = 'image'; }
            else { selector.value = 'none'; selectedBackgroundType = 'none'; }
        }
        // ユーザーが選んだ背景を、ZIP内の背景より優先して使う
        // TJA指定の背景があればそれを優先、無ければ別に用意した背景の種類
        function getPreferredBgType() {
            if (tjaBgSpecified.video && availableBackgrounds.video) return 'video';
            if (tjaBgSpecified.image && availableBackgrounds.image) return 'image';
            return customBg ? customBg.type : selectedBackgroundType;
        }
        function applyCustomBackground(select) {
            if (!customBg) return;
            // TJAで同じ種類の背景が指定されている場合は上書きしない
            if (!tjaBgSpecified[customBg.type]) {
                const old = availableBackgrounds[customBg.type];
                if (old && old !== customBg.url) URL.revokeObjectURL(old);
                availableBackgrounds[customBg.type] = customBg.url;
            }
            updateBackgroundSelector();
            const prefType = getPreferredBgType();
            dom.backgroundSelect.value = prefType;
            selectedBackgroundType = prefType;
            if (select) saveTaikoBeatmapSpecificSettings();
        }
        function bgTypeFromFile(file) {
            const name = (file.name || '').toLowerCase();
            if (file.type && file.type.startsWith('video/')) return 'video';
            if (file.type && file.type.startsWith('image/')) return 'image';
            if (BG_VIDEO_EXTS.some(e => name.endsWith(e))) return 'video';
            if (BG_IMAGE_EXTS.some(e => name.endsWith(e))) return 'image';
            return null;
        }
        function setCustomBackgroundFromBlob(blob, type) {
            if (customBg && customBg.url) {
                if (availableBackgrounds[customBg.type] === customBg.url) availableBackgrounds[customBg.type] = null;
                URL.revokeObjectURL(customBg.url);
            }
            customBg = { type, url: URL.createObjectURL(blob) };
        }
        // --- 背景ライブラリ：動画・画像に名前を付けてたくさん保存し、選んで使う ---
        const LIB_BG_KEY = 'taikoPlayerLibBg';          // 現在選んでいる背景のID
        const LIB_BG_MAP_KEY = 'taikoPlayerLibBgMap';   // 譜面ごとに選んだ背景のID
        let bgLibrary = [];                             // { id, name, type, mime, size }
        let selectedLibBgId = '';
        function getSongBgKeys() { return [getTaikoBeatmapSettingsKey(), getTaikoBeatmapContentKey()].filter(Boolean); }
        function readSongBgMap() { try { return JSON.parse(localStorage.getItem(LIB_BG_MAP_KEY)) || {}; } catch (e) { return {}; } }
        function writeSongBgMap(map) { try { localStorage.setItem(LIB_BG_MAP_KEY, JSON.stringify(map)); } catch (e) { console.warn(e); } }
        function rememberSongBg(id) {
            const keys = getSongBgKeys();
            if (keys.length === 0) return;
            const map = readSongBgMap();
            keys.forEach(k => { if (id) map[k] = id; else delete map[k]; });
            writeSongBgMap(map);
        }
        function recalledSongBg() {
            const map = readSongBgMap();
            for (const k of getSongBgKeys()) { if (map[k]) return map[k]; }
            return '';
        }
        function refreshBgLibraryUI() {
            const sel = dom.bgLibrarySelect;
            sel.innerHTML = '';
            sel.appendChild(new Option('-- 保存した背景を選択（標準に戻す） --', ''));
            [...bgLibrary].sort((x, y) => x.name.localeCompare(y.name, 'ja')).forEach(b => {

        // ctxStartSec(audioContext時刻) に譜面時間 gameMsAtStart - audioClockOffsetMs の位置が鳴るように、サンプル精度で予約する
        function scheduleMusic(ctxStartSec, bufPosMs) {
            stopMusic();
            if (!musicBuffer) return;
            const src = audioContext.createBufferSource();
            src.buffer = musicBuffer;
            src.connect(musicGainNode);
            if (bufPosMs >= 0) {
                if (bufPosMs / 1000 < musicBuffer.duration) src.start(ctxStartSec, bufPosMs / 1000);
            } else {
                src.start(ctxStartSec + (-bufPosMs) / 1000, 0);
            }
            musicSource = src;
        }
        async function getMusicBuffer() {
            if (!musicGainNode) {
                musicGainNode = audioContext.createGain();
                musicGainNode.gain.value = parseFloat(dom.musicVolumeSlider.value);
                musicGainNode.connect(audioContext.destination);
            }
            if (musicBuffer && musicBufferSrc === audioSrc) return musicBuffer;
            musicBuffer = null; musicBufferSrc = null;
            const res = await fetch(audioSrc);
            const ab = await res.arrayBuffer();
            const buf = await audioContext.decodeAudioData(ab);
            musicBuffer = buf; musicBufferSrc = audioSrc;
            return buf;
        }
        // 譜面時間を音声の実再生位置に合わせ直す（開始・再開・バッファ待ち復帰時）
        function resyncClockToAudio() {
            const pos = dom.audioPlayer.currentTime * 1000 + audioClockOffsetMs;
            gameStartTime = performance.now() - pos;
            totalPauseDuration = 0;
            heldGameTime = pos;
            clockHeld = false;
            lastAudioPos = -1;
        }
        // 毎フレーム、音声の再生位置と譜面時間の微小なズレを補正する（累積ドリフト防止）
        function correctClockDrift() {
            if (useWebAudioMusic || isPaused || clockHeld) return;
            const a = dom.audioPlayer;
            if (a.paused || a.ended || a.seeking) return;
            const pos = a.currentTime;
            if (pos === lastAudioPos) return;
            lastAudioPos = pos;
            const diff = (pos * 1000 + audioClockOffsetMs) - getGameTime();
            if (Math.abs(diff) > 30) gameStartTime -= diff;
            else gameStartTime -= diff * 0.05;
        }
        function updateLastCheckedNoteIndex() { while(hitObjects[lastCheckedNoteIndex] && hitObjects[lastCheckedNoteIndex].judged) { lastCheckedNoteIndex++; } }

        // --- 譜面分岐ロジック ---
        const BRANCH_LABELS = { N: '普通譜面', E: '玄人譜面', M: '達人譜面' };
        // 共通部分('C')か、選ばれた分岐に属するものだけが有効
        function isNoteActive(item) {
            return item.branch === undefined || item.branch === 'C' || regionChoice[item.region] === item.branch;
        }
        // 希望の分岐が存在しなければ 達人→玄人→普通 の順で下位に落とす
        function resolveBranch(region, desired) {
            const has = region.has || { N: true, E: false, M: false };
            const order = desired === 'M' ? ['M', 'E', 'N'] : (desired === 'E' ? ['E', 'N'] : ['N']);
            for (const b of order) { if (has[b]) return b; }
            for (const b of ['N', 'E', 'M']) { if (has[b]) return b; }
            return 'N';
        }
        function updateBranchIndicator(animate) {
            const el = dom.branchIndicator;
            if (!el) return;
            if (branchRegions.length === 0) { el.style.display = 'none'; return; }
            el.style.display = 'block';
            el.textContent = BRANCH_LABELS[currentBranch] || '';
            el.className = 'branch-' + currentBranch;
            if (animate) { el.style.animation = 'none'; void el.offsetHeight; el.style.animation = null; }
        }
        function resetSectionStats() {
            sectionBase = { ryo: judgmentCounts.ryo, ka: judgmentCounts.ka, fuka: judgmentCounts.fuka, roll: totalRollHits, score: score };
        }
        function initBranchState() {
            regionChoice = branchRegions.map(r => resolveBranch(r, 'N'));
            nextBranchIdx = 0;
            nextSectionIdx = 0;
            totalRollHits = 0;
            currentBranch = 'N';
            sectionBase = { ryo: 0, ka: 0, fuka: 0, roll: 0, score: 0 };
            updateBranchIndicator(false);
        }
        // 分岐の判定時刻：分岐先のノーツが画面に入る前に決める（直前の#SECTION以降）
        function getBranchDecisionTime(region) {
            const speed = Math.max(Math.abs(region.scroll) * (getPixelMultiplier()), 0.05);
            const travel = (dom.canvas.width - JUDGE_POINT_X + 100) / speed;
            let t = region.time - travel;
            // 分岐開始と同時刻の#SECTIONは「数える範囲が0」になるため無視する
            for (let i = sectionPoints.length - 1; i >= 0; i--) {
                if (sectionPoints[i].time < region.time - 1) { t = Math.max(t, sectionPoints[i].time); break; }
            }
            return Math.min(t, region.time);
        }
        function decideBranch(idx, region) {
            let chosen;
            const held = levelHoldPoints.some(p => p.time <= region.time + 1);
            if (held) {
                // #LEVELHOLD 以降は現在の譜面を維持
                chosen = resolveBranch(region, currentBranch);
            } else {
                let value;
                if (region.type === 'r') {
                    value = totalRollHits - sectionBase.roll;
                } else if (region.type === 's') {
                    value = score - sectionBase.score;
                } else {
                    const ryo = judgmentCounts.ryo - sectionBase.ryo;
                    const ka = judgmentCounts.ka - sectionBase.ka;
                    const fuka = judgmentCounts.fuka - sectionBase.fuka;
                    const total = ryo + ka + fuka;
                    value = total > 0 ? ((ryo + ka * 0.5) / total) * 100 : 0;
                }
                const EPS = 1e-9;
                let desired = 'N';
                if (value + EPS >= region.mThr) desired = 'M';
                else if (value + EPS >= region.eThr) desired = 'E';
                chosen = resolveBranch(region, desired);
            }
            regionChoice[idx] = chosen;
            // 選ばれなかった分岐のノーツは以後無効にする
            for (const note of hitObjects) {
                if (note.region === idx && note.branch !== 'C' && note.branch !== chosen) {
                    note.judged = true;
                    note.sePlayed = true;
                }
            }
            const changed = chosen !== currentBranch;
            currentBranch = chosen;
            updateBranchIndicator(changed);
            resetSectionStats();
        }
        function updateBranches(elapsedTime) {
            if (branchRegions.length === 0) return;
            const processSections = () => {
                const limit = nextBranchIdx < branchRegions.length ? branchRegions[nextBranchIdx].time - 1 : Infinity;
                while (nextSectionIdx < sectionPoints.length
                       && sectionPoints[nextSectionIdx].time <= elapsedTime
                       && sectionPoints[nextSectionIdx].time < limit) {
                    resetSectionStats();
                    nextSectionIdx++;
                }
            };
            processSections();
            while (nextBranchIdx < branchRegions.length) {
                const region = branchRegions[nextBranchIdx];
                if (elapsedTime < getBranchDecisionTime(region)) break;
                decideBranch(nextBranchIdx, region);
                nextBranchIdx++;
                processSections();
            }
        }
        
        function drawCapsule(ctx, x1, x2, y, radius, color) {
            if (x1 > x2)[x1, x2] = [x2, x1]; 
            ctx.beginPath();
            ctx.arc(x1, y, radius, Math.PI / 2, -Math.PI / 2);
            ctx.arc(x2, y, radius, -Math.PI / 2, Math.PI / 2);
            ctx.closePath();
            if (color) {
                ctx.fillStyle = color;
                ctx.fill();
            }
        }

        function gameLoop(ts) {
            renderNow = (typeof ts === 'number' && ts > 0) ? Math.min(ts, performance.now()) : null;
            try { gameLoopBody(); } finally { renderNow = null; }
        }
        function gameLoopBody() {
            if (!isGameRunning) return;
            animationFrameId = requestAnimationFrame(gameLoop);
            if (isPaused) return;
            correctClockDrift();
            const elapsedTime = getGameTime() - offset;
            updateBranches(elapsedTime);
            isGoGoNow = false;
            for (const section of goGoSections) {
                if (elapsedTime >= section.start && elapsedTime < section.end && isNoteActive(section)) {
                    isGoGoNow = true;
                    break;
                }
            }
            dom.ctx.clearRect(0, 0, dom.canvas.width, dom.canvas.height);
            
            drawJudgmentFrame();
            if (isGoGoNow) {
                drawGameArea(true);
            }

            if (laneCoverPercentage > 0) {
                const visibleWidth = dom.canvas.width * (1 - laneCoverPercentage / 100);
                dom.ctx.save();
                dom.ctx.beginPath();
                dom.ctx.rect(0, 0, visibleWidth, dom.canvas.height);
                dom.ctx.clip();
            }

            drawBarLines(elapsedTime);
            if (!optDoron) drawNotes(elapsedTime); // ドロン：音符は表示しない（下の文字は表示、判定は通常どおり）
            drawSyllables(elapsedTime);

        function drawJudgmentFrame() {
            const y = dom.canvas.height / 2;
            const ctx = dom.ctx;
            // 参考画像から実測した値（外輪：外径160px・太さ5px / 内輪：外径105.5px・太さ5px / 中央の塗り：直径78px）
            const k = NOTE_UNIT / 137;

            ctx.strokeStyle = 'rgba(255,255,255,0.28)';
            ctx.lineWidth = 5 * k;
            ctx.beginPath();
            ctx.arc(JUDGE_POINT_X, y, 77.5 * k, 0, Math.PI * 2);
            ctx.stroke();
            // 内側の輪（小音符の大きさ）
            ctx.strokeStyle = 'rgba(255,255,255,0.46)';
            ctx.lineWidth = 5 * k;
            ctx.beginPath();
            ctx.arc(JUDGE_POINT_X, y, 50.25 * k, 0, Math.PI * 2);
            ctx.stroke();
            // 中央の塗りつぶし
            ctx.fillStyle = 'rgba(255,255,255,0.205)';
            ctx.beginPath();
            ctx.arc(JUDGE_POINT_X, y, 39 * k, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGameArea(isGoGo) {
            if (isGoGo) {
                const fireGradient = dom.ctx.createLinearGradient(0, 0, 0, dom.canvas.height);
                fireGradient.addColorStop(0, "rgba(255, 100, 0, 0.3)");
                fireGradient.addColorStop(0.5, "rgba(255, 69, 0, 0.2)");

        }
        function drawBarLines(elapsedTime) {
            const pixelMultiplier = getPixelMultiplier();

            dom.ctx.globalAlpha = 0.85;
            dom.ctx.font = 'bold 15px sans-serif';

            const DRUM_CENTER_X = JUDGE_POINT_X - 126;
            dom.ctx.save();
            dom.ctx.beginPath();
            dom.ctx.rect(DRUM_CENTER_X, 0, dom.canvas.width - DRUM_CENTER_X, dom.canvas.height);
            dom.ctx.clip();
            barLines.forEach(line => {
                if (!isNoteActive(line)) return;
                const timeToJudge = line.time - elapsedTime;
                const x = JUDGE_POINT_X + timeToJudge * line.scrollSpeed * pixelMultiplier;
                if (x < DRUM_CENTER_X - 10 || x > dom.canvas.width + 50) return;
                dom.ctx.beginPath();
                dom.ctx.moveTo(x, 0);
                dom.ctx.lineTo(x, dom.canvas.height);
                dom.ctx.stroke();
            });
            dom.ctx.restore();
            dom.ctx.globalAlpha = 1.0;
        }
        
        function drawNotes(elapsedTime) {
            const y = dom.canvas.height / 2;
            const pixelMultiplier = getPixelMultiplier();
            const BEIGE_RING = '#F0EAD6';
            const BLACK_BORDER = '#000000';

            // 太鼓(ドラム)アイコンの中心より左は描画しない。音符は太鼓の下に潜り込んだ状態で見えなくなる。
            // ドラム中心X = 180px + --ui-offset-x、判定枠X = 390px + --ui-offset-x なので差は常に210px
            const DRUM_CENTER_X = JUDGE_POINT_X - 126;
            dom.ctx.save();
            dom.ctx.beginPath();
            dom.ctx.rect(DRUM_CENTER_X, 0, dom.canvas.width - DRUM_CENTER_X, dom.canvas.height);
            dom.ctx.clip();

            for (let i = hitObjects.length - 1; i >= 0; i--) {
                const note = hitObjects[i];

                // 見逃した音符・通り過ぎた連打/風船は、画面の左端まで流し切る
                if ((note.judged && !note.missed && !note.passed) || !isNoteActive(note)) continue;
                // オート時：叩く瞬間（elapsedTime >= note.time）のフレームでは、音符を必ず判定枠の中心に止めて描画する
                // （叩く処理は描画の後に走るため、補正しないと1フレーム分だけ判定枠を通り過ぎた位置で消える）
                const timeToJudge = (isAutoPlay && (note.type === 'don' || note.type === 'katsu'))
                    ? Math.max(0, note.time - elapsedTime)
                    : note.time - elapsedTime;
                const startX = JUDGE_POINT_X + timeToJudge * note.scrollSpeed * pixelMultiplier;

                if (note.type === 'roll') {
                    const timeToEnd = note.endTime - elapsedTime;
                    const endX = JUDGE_POINT_X + timeToEnd * note.scrollSpeed * pixelMultiplier;
                    if (endX < -150 || startX > dom.canvas.width + 50) continue;

                    const barHeight = note.isBig ? NOTE_UNIT * 1.1672 : NOTE_UNIT * 0.77; // 大連打は大音符(半径 y*0.585)と同じ大きさ
                    const headRadius = barHeight / 2;
                    const BAR_THICKNESS_SCALE = 1.046;
                    const barRadius = headRadius * BAR_THICKNESS_SCALE;
                    
                    const BLACK_BORDER_THICKNESS = 2;
                    const WHITE_BORDER_THICKNESS = 6;

                    drawCapsule(dom.ctx, startX, endX, y, barRadius, BLACK_BORDER);
                    drawCapsule(dom.ctx, startX, endX, y, barRadius - BLACK_BORDER_THICKNESS, BEIGE_RING);
                    drawCapsule(dom.ctx, startX, endX, y, barRadius - BLACK_BORDER_THICKNESS - WHITE_BORDER_THICKNESS, '#FFC700');

                    dom.ctx.fillStyle = BLACK_BORDER;
                    dom.ctx.beginPath();
                    dom.ctx.arc(startX, y, headRadius, 0, Math.PI * 2);
                    dom.ctx.fill();

                    dom.ctx.fillStyle = BEIGE_RING;
                    dom.ctx.beginPath();
                    dom.ctx.arc(startX, y, headRadius - BLACK_BORDER_THICKNESS, 0, Math.PI * 2);
                    dom.ctx.fill();

                    dom.ctx.fillStyle = '#FFC700';
                    dom.ctx.beginPath();
                    dom.ctx.arc(startX, y, headRadius - BLACK_BORDER_THICKNESS - WHITE_BORDER_THICKNESS, 0, Math.PI * 2);
                    dom.ctx.fill();
                

                } else if (note.type === 'balloon') {
                     const timeToEnd = note.endTime - elapsedTime;
                    const endX = JUDGE_POINT_X + timeToEnd * note.scrollSpeed * pixelMultiplier;
                    
                    const radius = NOTE_UNIT * 0.405; 
                    let currentX = startX;
                    if (startX < JUDGE_POINT_X && endX > JUDGE_POINT_X) {
                        currentX = JUDGE_POINT_X;
                    }
                    if (currentX < -radius) continue;

                    const BLACK_BORDER_THICKNESS = 2;
                    const WHITE_BORDER_THICKNESS = 6;
                    const ORANGE_FILL = '#F98025';

                    dom.ctx.fillStyle = BLACK_BORDER;
                    dom.ctx.beginPath();
                    dom.ctx.arc(currentX, y, radius, 0, Math.PI * 2);
                    dom.ctx.fill();

                    dom.ctx.fillStyle = BEIGE_RING;
                    dom.ctx.beginPath();
                    dom.ctx.arc(currentX, y, radius - BLACK_BORDER_THICKNESS, 0, Math.PI * 2);
                    dom.ctx.fill();

                    dom.ctx.fillStyle = ORANGE_FILL;
                    dom.ctx.beginPath();
                    dom.ctx.arc(currentX, y, radius - BLACK_BORDER_THICKNESS - WHITE_BORDER_THICKNESS, 0, Math.PI * 2);
                    dom.ctx.fill();
                    
                    const remainingHits = note.hitsRequired - note.hitsMade;
                    if (remainingHits > 0) {
                        dom.ctx.fillStyle = '#fff';
                        dom.ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                        dom.ctx.lineWidth = 4;

                        dom.ctx.textAlign = 'center';
                        dom.ctx.textBaseline = 'middle';
                        dom.ctx.strokeText(remainingHits, currentX, y);
                        dom.ctx.fillText(remainingHits, currentX, y);
                    }

                } else { 
                    if (startX > dom.canvas.width + 50 || startX < -(note.isBig ? NOTE_UNIT * 0.5836 : NOTE_UNIT * 0.385) - 10) continue;
                    
                    const color = note.type === 'don' ? '#F83838' : '#46B6B6';
                    const baseRadius = note.isBig ? NOTE_UNIT * 0.5836 : NOTE_UNIT * 0.385;
                    
                    const BLACK_BORDER_THICKNESS = 2;
                    const WHITE_BORDER_THICKNESS = 6;

                    dom.ctx.fillStyle = BLACK_BORDER;
                    dom.ctx.beginPath();
                    dom.ctx.arc(startX, y, baseRadius, 0, Math.PI * 2);
                    dom.ctx.fill();

                    dom.ctx.fillStyle = BEIGE_RING;
                    dom.ctx.beginPath();
                    dom.ctx.arc(startX, y, baseRadius - BLACK_BORDER_THICKNESS, 0, Math.PI * 2);
                    dom.ctx.fill();

                    dom.ctx.beginPath();
                    dom.ctx.arc(startX, y, baseRadius - BLACK_BORDER_THICKNESS - WHITE_BORDER_THICKNESS, 0, Math.PI * 2);

                }
            }
            dom.ctx.restore();
        }
        // レーン下の帯に、各音符の口唱歌（ド / ドン / カ / カッ）を音符と一緒に流す
        const SYLLABLE_FONT = (px) => `bold ${px}px "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif`;
        const labelSpriteCache = new Map();
        function getLabelSprite(label, fontSize, h, cy) {
            const key = label + '|' + fontSize + '|' + h;
            let s = labelSpriteCache.get(key);
            if (s) return s;
            const lw = Math.max(4, fontSize * 0.28);
            const c = document.createElement('canvas');
            let x = c.getContext('2d');
            x.font = SYLLABLE_FONT(fontSize);
            const tw = x.measureText(label).width;
            const pad = Math.ceil(lw) + 2;
            c.width = Math.ceil(tw + pad * 2); c.height = h;   // サイズ変更でコンテキストの設定は初期化される
            x = c.getContext('2d');
            x.font = SYLLABLE_FONT(fontSize);
            x.textAlign = 'left'; x.textBaseline = 'middle'; x.lineJoin = 'round';
            x.lineWidth = lw; x.strokeStyle = '#1a1a1a'; x.fillStyle = '#FFFFFF';
            x.strokeText(label, pad, cy); x.fillText(label, pad, cy);
            s = { c, pad, tw };
            if (labelSpriteCache.size > 200) labelSpriteCache.clear();
            labelSpriteCache.set(key, s);
            return s;
        }
        function drawSyllables(elapsedTime) {
            const cv = dom.stripCanvas, ctx = dom.stripCtx;
            if (!cv || !ctx) return;
            ctx.clearRect(0, 0, cv.width, cv.height);
            const pixelMultiplier = getPixelMultiplier();
            const DRUM_CENTER_X = JUDGE_POINT_X - 126;
            ctx.save();
            ctx.beginPath();
            const visibleWidth = laneCoverPercentage > 0 ? cv.width * (1 - laneCoverPercentage / 100) : cv.width;
            ctx.rect(DRUM_CENTER_X, 0, Math.max(0, visibleWidth - DRUM_CENTER_X), cv.height);
            ctx.clip();
            const fontSize = Math.round(cv.height * 0.68);
            ctx.font = `bold ${fontSize}px "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineJoin = 'round';
            ctx.lineWidth = Math.max(4, fontSize * 0.28);
            ctx.strokeStyle = '#1a1a1a';
            ctx.fillStyle = '#FFFFFF';
            const cy = cv.height / 2 + 1;
            for (let i = 0; i < hitObjects.length; i++) {
                const note = hitObjects[i];
                if (!note.label || !isNoteActive(note) || (note.judged && !note.missed && !note.passed)) continue;
                if (note.type === 'roll') {
                    const rx = JUDGE_POINT_X + (note.time - elapsedTime) * note.scrollSpeed * pixelMultiplier;
                    const endX = JUDGE_POINT_X + (note.endTime - elapsedTime) * note.scrollSpeed * pixelMultiplier;
                    if (rx > cv.width + 60 || endX < DRUM_CENTER_X - 10) continue;
                    const tx = rx - fontSize * 0.5;
                    const rs = getLabelSprite(note.label, fontSize, cv.height, cy);
                    ctx.drawImage(rs.c, tx - rs.pad, 0);
                    const lineStart = tx + rs.tw + 2;
                    if (endX > lineStart) {
                        ctx.lineCap = 'round';
                        ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = Math.max(4, fontSize * 0.28) + 6;
                        ctx.beginPath(); ctx.moveTo(lineStart, cy); ctx.lineTo(endX, cy); ctx.stroke();
                        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 6;
                        ctx.beginPath(); ctx.moveTo(lineStart, cy); ctx.lineTo(endX, cy); ctx.stroke();
                        ctx.lineCap = 'butt';
                        ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = Math.max(4, fontSize * 0.28);
                    }
                    continue;
                }
                if (note.type === 'balloon') {
                    // 風船本体と同じ位置（叩ける間は判定枠に止まる）に「ふうせん」を表示
                    const bStartX = JUDGE_POINT_X + (note.time - elapsedTime) * note.scrollSpeed * pixelMultiplier;
                    const bEndX = JUDGE_POINT_X + (note.endTime - elapsedTime) * note.scrollSpeed * pixelMultiplier;
                    let bx = bStartX;
                    if (bStartX < JUDGE_POINT_X && bEndX > JUDGE_POINT_X) bx = JUDGE_POINT_X;
                    if (bx > cv.width + 60 || bx < DRUM_CENTER_X - 60) continue;
                    const bs = getLabelSprite(note.label, fontSize, cv.height, cy);
                    ctx.drawImage(bs.c, bx - bs.pad - bs.tw / 2, 0);
                    continue;
                }
                const timeToJudge = isAutoPlay ? Math.max(0, note.time - elapsedTime) : note.time - elapsedTime;
                const x = JUDGE_POINT_X + timeToJudge * note.scrollSpeed * pixelMultiplier;
                if (x > cv.width + 60) continue;
                if (x < DRUM_CENTER_X - 60) continue;
                const ns = getLabelSprite(note.label, fontSize, cv.height, cy);
                ctx.drawImage(ns.c, x - ns.pad - ns.tw / 2, 0);
            }
            ctx.restore();
        }
        let rollShownValue = -1, rollShownVisible = false;

                while (k < M - 1 && cum[k + 1] < target) k++;
                const seg = cum[k + 1] - cum[k] || 1, f = Math.min(1, Math.max(0, (target - cum[k]) / seg));
                const x = pts[k][0] + (pts[k + 1][0] - pts[k][0]) * f, y = pts[k][1] + (pts[k + 1][1] - pts[k][1]) * f;
                frames.push({ transform: `translate(${x - dia / 2}px,${y - dia / 2}px)` });
            }
            const a = d.animate(frames, { duration: 560, easing: 'linear', fill: 'forwards' });
            a.onfinish = () => { onArrive(); const last = frames[frames.length - 1].transform; const f = d.animate([{ transform: last, opacity: 1 }, { transform: last, opacity: 0 }], { duration: 500, easing: 'linear', fill: 'forwards' }); f.onfinish = () => d.remove(); }; // 魂に届いたら0.5秒かけてだんだん薄くなって消える
        }
        function spawnHitEffect(type, isBig, judgement) {
            if (dom.gameContainer.style.display === 'none') return;
            const layer = getFxLayer();
            if (layer.childElementCount > 200) return;
            const P = getFxPoints();
            const dia = P.h * (isBig ? 0.5836 : 0.385);
            fxFlash(layer, P.jx, P.jy, dia * 1.9, judgement === 'ryo' ? 'rgba(255,215,90,0.8)' : 'rgba(255,255,255,0.6)');
            const fill = type === 'don' ? '#F83838' : '#46B6B6';
            fxFly(layer, P, dia, fill, () => fxBurst(layer, P.sx, P.sy, isBig ? 1.25 : 1, isBig ? 10 : 7), isBig);
        }
        // 連打：その音符の大きさのまま魂へ飛ぶ（小連打は小音符サイズ、大連打は大音符サイズ）
        function spawnRollEffect(note, keyType) {
            const now = performance.now();
            if (now - lastRollFxTime < 45 || dom.gameContainer.style.display === 'none') return;
            lastRollFxTime = now;
            const layer = getFxLayer();
            if (layer.childElementCount > 200) return;
            const P = getFxPoints();
            const big = !!note.isBig;
            fxFlash(layer, P.jx, P.jy, P.h * 0.8, keyType === 'katsu' ? 'rgba(120,200,255,0.6)' : 'rgba(255,200,60,0.6)');
            fxFly(layer, P, P.h * (big ? 0.5836 : 0.385), keyType === 'katsu' ? '#46B6B6' : '#F83838', () => fxBurst(layer, P.sx, P.sy, big ? 1.25 : 1, big ? 10 : 6), big); // 大連打は大音符と同じ大きさで飛ぶ
        }
        // 風船：規定回数を叩ききったら大音符サイズで魂へ飛ぶ
        function spawnBalloonBreakEffect() {
            if (dom.gameContainer.style.display === 'none') return;
            const layer = getFxLayer();
            const P = getFxPoints();
            fxFlash(layer, P.jx, P.jy, P.h * 1.3, 'rgba(255,170,40,0.8)');
            fxFly(layer, P, P.h * 0.585, '#F83838', () => fxBurst(layer, P.sx, P.sy, 1.4, 12), true);
        }
        function handleJudgment(judgement, note, diff = null) {
            if(note.judged) return;
            note.judged = true;
            if (!isAutoSE) note.sePlayed = true;
            if (diff !== null) {
                showHitError(diff);
            }
            const judgmentMap = { ryo: '良', ka: '可', fuka: '不可'};
            showJudgment(judgmentMap[judgement]);
            judgmentCounts[judgement]++;
            applyGauge(judgement);
            if ((judgement === 'ryo' || judgement === 'ka') && (note.type === 'don' || note.type === 'katsu')) spawnHitEffect(note.type, !!note.isBig, judgement);
            if(judgement === 'ryo' || judgement === 'ka') {
                // ニジイロ配点: コンボ加点・ゴーゴー倍率・大音符2倍なし。可は半分(1の位切り捨て)
                const basePoints = judgement === 'ryo' ? nijiroNoteScore : Math.floor(nijiroNoteScore / 2 / 10) * 10;
                updateScore(basePoints);
                updateCombo(true);
            } else {
                updateCombo(false);
            }
            updateAccuracy();
            if (!isAutoPlay) {
                const isMiss = judgement === 'fuka';
                const isNotPerfect = judgement === 'ka' || judgement === 'fuka'; // 超モード：良以外
                if ((optMissMode === 'kanpeki' && isMiss) || (optMissMode === 'chokanpeki' && isNotPerfect)) endPlayEarly();
                else if ((optMissMode === 'tokkun' && isMiss) || (optMissMode === 'chotokkun' && isNotPerfect)) retryGame();
            }
        }
        function updateScore(points) { score += points; dom.scoreElement.textContent = Math.floor(score); }
        function updateCombo(hit) { if (hit) { combo++; if (combo > maxCombo) maxCombo = combo; } else { combo = 0; } updateComboDisplay(); }
        function updateAccuracy() { const totalHits = judgmentCounts.ryo + judgmentCounts.ka + judgmentCounts.fuka; if (totalHits === 0) { accuracy = 100; } else { const accVal = (judgmentCounts.ryo * 300 + judgmentCounts.ka * 150) / (totalHits * 300); accuracy = accVal * 100; } let rank = 'S'; if (accuracy < 100) rank = 'S'; if (accuracy < 95) rank = 'A'; if (accuracy < 90) rank = 'B'; if (accuracy < 80) rank = 'C'; if (accuracy < 70) rank = 'D'; dom.accuracyElement.textContent = `${rank} ${accuracy.toFixed(2)}%`; }
        function showJudgment(text) { const el = dom.judgmentTextElement; const judgmentStyles = { "良": 'gold', "可": 'white', "不可": '#dda0dd' }; el.textContent = text; el.style.color = judgmentStyles[text] || 'white'; el.style.animation = 'none'; void el.offsetHeight; el.style.animation = null; }
        // 数字は「行の高さ(line-height:1)」の中心ではなく、字そのものの中心が丸の中心に来るように補正する
        function alignComboDigits() {
            try {
                const el = dom.comboElement;
                const cs = getComputedStyle(el);
                const size = parseFloat(cs.fontSize);
                const c = document.createElement('canvas').getContext('2d');
                c.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
                const m = c.measureText('0123456789');
                const fa = m.fontBoundingBoxAscent, fd = m.fontBoundingBoxDescent;
                if (!isFinite(fa) || !isFinite(fd) || !m.actualBoundingBoxAscent) return;
                const baselineFromTop = (size - (fa + fd)) / 2 + fa;                       // 行の上端から基準線までの距離
                const glyphCenterFromTop = baselineFromTop - (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
                el.style.transform = `translateY(${(size / 2 - glyphCenterFromTop).toFixed(2)}px)`;
            } catch (e) { /* 補正できなくても表示には影響しない */ }
        }
        function updateComboDisplay() { if (combo > 0) { dom.comboElement.textContent = combo; dom.comboDisplay.classList.add('visible'); } else { dom.comboDisplay.classList.remove('visible'); } }
        function updateResultsSelection() { const buttons = dom.resultsOverlay.querySelectorAll('.overlay-button'); buttons.forEach((btn, index) => { btn.classList.toggle('selected', index === selectedResultsIndex); }); }
        function updatePauseSelection() { const buttons = dom.pauseOverlay.querySelectorAll('.overlay-button'); buttons.forEach((btn, index) => { btn.classList.toggle('selected', index === selectedPauseIndex); }); }
        
        function togglePause() { 
            if (isInitialCooldown || !isGameRunning || isPauseButtonCoolingDown) return; 
            isPauseButtonCoolingDown = true; setTimeout(() => { isPauseButtonCoolingDown = false; }, 500); 
            if (!isPaused) { 
                // 停止した瞬間の譜面時間をそのまま保持（音声の currentTime には依存しない）
                heldGameTime = getGameTime();
                clockHeld = false;
                isPaused = true; 
                pauseStartTime = performance.now(); 
                pausedTime = dom.audioPlayer.currentTime;
                stopMusic();
                dom.audioPlayer.pause(); 
                if (selectedBackgroundType === 'video' && availableBackgrounds.video) dom.backgroundVideo.pause(); 
                dom.gameContainer.classList.remove('playing'); 
                cancelAnimationFrame(animationFrameId); 
                dom.pauseOverlay.style.display = 'flex'; 
                selectedPauseIndex = 0; 
                updatePauseSelection(); 
            } else { 
                const runId = gameRunId;
                const audioTargetMs = heldGameTime - audioClockOffsetMs;
                isPaused = false; 
                if (useWebAudioMusic) {
                    // 再開位置を audioContext 時刻で予約。譜面時間も同じ時計から算出するので、一時停止前後で音と譜面の相対位置は変わらない
                    if (audioContext.state === 'suspended') audioContext.resume();
                    const lead = 0.12;
                    const ctxStart = audioContext.currentTime + lead;
                    ctxZero = ctxStart - heldGameTime / 1000;
                    smoothSynced = false; lastCtxSample = -1;
                    clockReleaseCtx = ctxStart;
                    clockHeld = true;
                    scheduleMusic(ctxStart, heldGameTime - audioClockOffsetMs);
                } else if (audioTargetMs >= 0) {
                    // 音声が実際に鳴り始めるまで譜面時間を固定し、鳴り始めた位置に合わせて再開する
                    clockHeld = true;
                    dom.audioPlayer.currentTime = audioTargetMs / 1000;
                    const releaseFallback = setTimeout(() => {
                        if (runId === gameRunId && clockHeld) {
                            gameStartTime = performance.now() - heldGameTime; totalPauseDuration = 0; clockHeld = false; lastAudioPos = -1;
                        }
                    }, 2000);
                    const p = dom.audioPlayer.play();
                    if (p && p.catch) p.catch(() => {
                        clearTimeout(releaseFallback);
                        if (runId === gameRunId && clockHeld) {
                            gameStartTime = performance.now() - heldGameTime; totalPauseDuration = 0; clockHeld = false; lastAudioPos = -1;
                        }
                    });
                } else {
                    // 音声の再生開始前に止めた場合：譜面時間をその地点から進め、音声は予定時刻に開始
                    clockHeld = false;
                    gameStartTime = performance.now() - heldGameTime; totalPauseDuration = 0; lastAudioPos = -1;
                    dom.audioPlayer.currentTime = 0;
                    setTimeout(() => { if (runId === gameRunId && isGameRunning && !isPaused) dom.audioPlayer.play(); }, -audioTargetMs);
                }
                if (selectedBackgroundType === 'video' && availableBackgrounds.video) dom.backgroundVideo.play(); 
                dom.gameContainer.classList.add('playing'); 
                animationFrameId = requestAnimationFrame(gameLoop); 
                dom.pauseOverlay.style.display = 'none'; 
            } 
        }

        document.addEventListener('keydown', e => {
            if (activeGame === 'taiko') {
                if (isPaused) {
                    const buttons = dom.pauseOverlay.querySelectorAll('.overlay-button');
                    if (buttons.length === 0) return;

                    switch (e.key) {
                        case 'ArrowUp':
                            e.preventDefault();
                            selectedPauseIndex = (selectedPauseIndex - 1 + buttons.length) % buttons.length;
                            updatePauseSelection();
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            selectedPauseIndex = (selectedPauseIndex + 1) % buttons.length;
                            updatePauseSelection();
                            break;
                        case 'Enter':
                            e.preventDefault();
                            buttons[selectedPauseIndex].click();
                            break;
                        case 'ArrowLeft':
                        case 'ArrowRight':
                            e.preventDefault(); 
                            break;
                    }
                } else if (dom.resultsOverlay.style.display === 'flex') {
                    const rButtons = dom.resultsOverlay.querySelectorAll('.overlay-button');
                    if (rButtons.length === 0) return;
                    switch (e.key) {
                        case 'ArrowUp':
                            e.preventDefault();
                            selectedResultsIndex = (selectedResultsIndex - 1 + rButtons.length) % rButtons.length;
                            updateResultsSelection();
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            selectedResultsIndex = (selectedResultsIndex + 1) % rButtons.length;
                            updateResultsSelection();
                            break;
                        case 'Enter':
                            e.preventDefault();
                            rButtons[selectedResultsIndex].click();
                            break;
                        case 'ArrowLeft':
                        case 'ArrowRight':
                            e.preventDefault();
                            break;
                    }
                } else if (isGameRunning && e.code === 'Space') {
                    e.preventDefault();
                } else if (!isGameRunning && e.code === 'Space' && !dom.startButton.disabled) {
                    e.preventDefault();
                    startGame();
                }
            }
        });

        function retryGame() { 
            gameRunId++; clockHeld = false; stopMusic();
            isGameRunning = false; 
            if(animationFrameId) cancelAnimationFrame(animationFrameId); 
            dom.audioPlayer.pause(); 
            dom.audioPlayer.load();
            if (selectedBackgroundType === 'video' && dom.backgroundVideo) dom.backgroundVideo.pause(); 
            dom.pauseOverlay.style.display = 'none'; 
            dom.resultsOverlay.style.display = 'none'; 
            if (beatmapLoaded && audioLoaded) { 
                startGame(); 
            } else { 
                returnToControls(); 
            } 
        }
        function returnToControls() {
            gameRunId++; clockHeld = false; stopMusic();
            isGameRunning = false;
            isPaused = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
            if (dom.audioPlayer) {
                dom.audioPlayer.pause();
                dom.audioPlayer.currentTime = 0;
            }
            if (selectedBackgroundType === 'video' && dom.backgroundVideo) {
                dom.backgroundVideo.pause();
                dom.backgroundVideo.load();
                dom.backgroundVideo.currentTime = 0;
            }
            dom.pauseOverlay.style.display = 'none';
            dom.resultsOverlay.style.display = 'none';
            dom.gameContainer.classList.remove('playing');
            dom.gameContainer.style.display = 'none';
            dom.appContainer.style.display = 'flex';
            resetGame();
        }
        function showResults() { 
            if(!isGameRunning && dom.resultsOverlay.style.display === 'flex') return;
            playEndTime = getGameTime();
            isGameRunning = false; 
            cancelAnimationFrame(animationFrameId); 
            dom.gameContainer.classList.remove('playing'); 
            const totalHits = judgmentCounts.ryo + judgmentCounts.ka + judgmentCounts.fuka; 
            let finalAccuracy = 100; 
            if (totalHits > 0) { const accVal = (judgmentCounts.ryo * 300 + judgmentCounts.ka * 150) / (totalHits * 300); finalAccuracy = accVal * 100; } 
            setSongTitleDisplay(dom.resultsSongTitle, songInfo.title, songInfo.subtitle, ` - ${songInfo.version}`); 
            dom.resultsScoreValue.textContent = Math.floor(score); 
            dom.resultsMaxComboValue.textContent = maxCombo; 
            dom.resultsRyoValue.textContent = judgmentCounts.ryo; 
            dom.resultsKaValue.textContent = judgmentCounts.ka; 
            dom.resultsFukaValue.textContent = judgmentCounts.fuka; 
            const gaugeCleared = isGaugeCleared();
            const isFullCombo = !playAborted && totalHits > 0 && judgmentCounts.fuka === 0;
            const isAllPerfect = isFullCombo && judgmentCounts.ka === 0;
            if (isAllPerfect) {
                dom.resultsClearStatus.textContent = 'ALLPERFECT';
                dom.resultsClearStatus.className = 'allperfect';
            } else if (isFullCombo) {
                dom.resultsClearStatus.textContent = 'FULLCOMBO';
                dom.resultsClearStatus.className = 'fullcombo';
            } else {
                const cleared = gaugeCleared && !playAborted;
                dom.resultsClearStatus.textContent = cleared ? 'CLEAR' : 'FAILED';
                dom.resultsClearStatus.className = cleared ? 'clear' : 'failed';
            }

            selectedResultsIndex = 0;
            updateResultsSelection();
            dom.resultsOverlay.style.display = 'flex'; 
            if (selectedBackgroundType === 'video') dom.backgroundVideo.pause(); 
        }
        async function saveSongToPc() {
            const songId = dom.savedSongsList.value;
            if (!songId) {
                alert('PCに保存する譜面を「保存済み譜面」から選択してください。');
                return;
            }
            dom.saveSongToPcButton.textContent = '準備中...';
            dom.saveSongToPcButton.disabled = true;
            try {
                const blob = await db.getSongBlob(songId);
                if (!blob) throw new Error('Blob data not found in DB.');

                const fileName = songId.substring(songId.indexOf('-') + 1);

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (err) {
                alert('ファイルの保存に失敗しました。');
                console.error('Failed to save .zip file from Taiko player:', err);
            } finally {
                dom.saveSongToPcButton.textContent = 'PCへ保存';
                dom.saveSongToPcButton.disabled = !dom.savedSongsList.value;
            }
        }
        function applyMusicVolume(value) {
            dom.audioPlayer.volume = value;
            if (musicGainNode) musicGainNode.gain.value = value;
            dom.musicVolumeLabel.textContent = Math.round(value * 100);
        }
        function applySEVolume(value) {
            if (seGainNode) {
                seGainNode.gain.value = value;
            }
            dom.seVolumeLabel.textContent = Math.round(value * 100);
        }

        return {
            initialize: async function() {
                initAudioContext(); 
                initKeyConfig();
                setupFileListeners();
                loadSettings();
                alignComboDigits();
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignComboDigits);
                updateLaneOpacity();
                updateBgBrightness();
                updateLaneCover();
                dom.startButton.addEventListener('click', startGame);
                dom.speedSlider.addEventListener('input', () => {
                    updateSpeed();
                    saveTaikoBeatmapSpecificSettings();
                });
                dom.offsetInput.addEventListener('change', saveSettings);
                dom.videoOffsetInput.addEventListener('change', saveTaikoBeatmapSpecificSettings);
                dom.videoOffsetInput.addEventListener('input', saveTaikoBeatmapSpecificSettings);
                dom.seOffsetInput.addEventListener('change', saveSettings);
                dom.autoPlayCheckbox.addEventListener('change', saveSettings);
                dom.singleHandBigNoteCheckbox.addEventListener('change', saveSettings);
                dom.autoSeCheckbox.addEventListener('change', saveSettings);
                dom.missModeSelect.addEventListener('change', saveSettings);
                dom.placementSelect.addEventListener('change', saveSettings);
                dom.doronCheckbox.addEventListener('change', saveSettings);
                dom.skipCheckbox.addEventListener('change', saveSettings);
                dom.individualOffsetInput.addEventListener('change', saveTaikoBeatmapSpecificSettings);
                dom.saveSongToPcButton.addEventListener('click', saveSongToPc);
                dom.resumeButton.addEventListener('click', togglePause);
                // 音声が実際に鳴り始めた（開始・再開・バッファ復帰）時点で譜面時間を音声位置に合わせる
                dom.audioPlayer.addEventListener('playing', () => { if (isGameRunning && !isPaused && !useWebAudioMusic) resyncClockToAudio(); });
                dom.retryButton.addEventListener('click', retryGame);
                dom.backToTitlePause.addEventListener('click', returnToControls);
                dom.resultsRetryButton.addEventListener('click', retryGame);
                dom.backToTitleResults.addEventListener('click', returnToControls);
                dom.laneOpacitySlider.addEventListener('input', () => { updateLaneOpacity(); saveSettings(); });
                dom.bgBrightnessSlider.addEventListener('input', () => { updateBgBrightness(); saveSettings(); });
                dom.laneCoverSlider.addEventListener('input', () => { updateLaneCover(); saveSettings(); });
                dom.backgroundSelect.addEventListener('change', e => { selectedBackgroundType = e.target.value; saveTaikoBeatmapSpecificSettings(); });
                dom.musicVolumeSlider.addEventListener('input', e => { applyMusicVolume(e.target.value); saveSettings(); });
                dom.seVolumeSlider.addEventListener('input', e => { applySEVolume(e.target.value); saveSettings(); });

                window.addEventListener('resize', initGameUI);
                try {
                    await db.init();
                    await loadSavedSongsList();
                    await loadDefaultSounds();
                    await loadSeLibrary();
                    await loadBackgroundLibrary();
                } catch (e) {
                    console.error('Application initialization failed:', e);
                    alert('データベースの初期化に失敗しました。保存機能は利用できません。');
                }
                initializeShortcutKeySetup('taiko-shortcut-retry', 'taiko-shortcut-menu');
            },
            togglePauseExternal: togglePause,
            retryGameExternal: function() {
                if (isGameRunning || isPaused || dom.resultsOverlay.style.display === 'flex') {
                    retryGame();
                }
            },
            returnToControlsExternal: function() { 
                if (isGameRunning || isPaused || dom.resultsOverlay.style.display === 'flex') {
                    returnToControls();
                }
            }
        };
    })();

    </script>
