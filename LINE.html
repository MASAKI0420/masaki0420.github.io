<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>フル機能LINE風アプリ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; height: 100dvh; overflow: hidden; font-family: sans-serif; background-color: #f5f5f5; }
        * { box-sizing: border-box; }
        .page { display: none; width: 100%; height: 100%; flex-direction: column; }
        .page.active { display: flex; }

        header { background-color: #06C755; color: white; padding: 15px; font-size: 18px; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; flex-shrink: 0; }
        .back-btn { background: none; border: none; color: white; font-size: 20px; position: absolute; left: 10px; cursor: pointer; }
        button { cursor: pointer; }
        input[type="text"] { border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }

        .icon-preview { width: 80px; height: 80px; background-color: #ccc; border-radius: 50%; margin: 0 auto; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; font-weight: bold; overflow: hidden; border: 2px solid #06C755; }
        .icon-preview img { width: 100%; height: 100%; object-fit: cover; }

        /* ログイン */
        #login-page { justify-content: center; align-items: center; background-color: #7494C0; }
        .login-box { background: white; padding: 30px; border-radius: 12px; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; }
        .login-box button { width: 100%; padding: 12px; background: #06C755; color: white; border: none; border-radius: 8px; font-weight: bold; }

        /* ホーム */
        .profile-area { background: white; padding: 20px; text-align: center; border-bottom: 1px solid #ddd; flex-shrink: 0; }
        .settings-area { padding: 15px; background: white; margin-top: 5px; flex-shrink: 0; border-bottom: 1px solid #ddd; }
        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
        .action-btns button { flex: 1; text-align: center; padding: 10px; background: #f0f0f0; border-radius: 8px; font-size: 12px; color: #333; border: 1px solid #ccc; font-weight: bold; }
        
        .list-container { list-style: none; padding: 0; margin: 0; background: white; flex: 1; overflow-y: auto; }
        .list-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; cursor: pointer; -webkit-touch-callout: none; user-select: none; }
        .list-item-icon { width: 45px; height: 45px; background: #ccc; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 18px; margin-right: 15px; overflow: hidden; flex-shrink: 0; }
        .list-item-icon img { width: 100%; height: 100%; object-fit: cover; }
        .list-item-name { font-weight: bold; font-size: 16px; color: #333; }

        /* トーク画面 */
        #chat-page { background-color: #7494C0; }
        #chat-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }
        .message-row { display: flex; margin-bottom: 15px; max-width: 100%; }
        .message-row.other { justify-content: flex-start; }
        .message-row.mine { justify-content: flex-end; }
        
        .avatar-area { display: flex; flex-direction: column; align-items: center; margin-right: 8px; width: 40px; }
        .avatar { width: 40px; height: 40px; background-color: #ccc; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 16px; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .message-content { display: flex; flex-direction: column; max-width: 70%; }
        .message-row.other .message-content { align-items: flex-start; }
        .message-row.mine .message-content { align-items: flex-end; }
        
        .bubble { padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); width: fit-content; }
        .message-row.other .bubble { background-color: #fff; color: #333; border-top-left-radius: 2px; }
        .message-row.mine .bubble { background-color: #8de055; color: #111; border-top-right-radius: 2px; }
        
        .bubble img { max-width: 100%; border-radius: 8px; display: block; cursor: zoom-in; }
        .time { font-size: 11px; color: #e5e5e5; align-self: flex-end; margin: 0 5px; }
        
        #input-area { background-color: #f5f5f5; padding: 10px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #ddd; flex-shrink: 0; }
        .photo-btn { font-size: 24px; color: #666; cursor: pointer; margin-right: 5px; }
        #messageInput { flex: 1; padding: 10px 15px; }
        #submitBtn { background-color: #06C755; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .send-icon { width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 14px solid white; margin-left: 4px; }

        /* モーダル群 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; }
        #qrCanvas { width: 100%; border-radius: 8px; background: #000; display: block; margin: 0 auto; }
        #imageViewerModal { background: rgba(0,0,0,0.9); cursor: zoom-out; }
    </style>
</head>
<body>

    <!-- ログイン -->
    <div id="login-page" class="page active">
        <div class="login-box">
            <h2 style="color:#06C755; margin-top:0;">プロフィール</h2>
            <div id="regIconArea" style="cursor:pointer;">
                <div class="icon-preview" id="regIconPreview">画</div>
                <div style="font-size:12px; color:#666; margin-top:5px;">タップしてアイコン選択</div>
                <input type="file" id="regIconInput" accept="image/*" style="display:none;">
            </div>
            <input type="text" id="regNameInput" placeholder="あなたの名前">
            <button id="registerBtn">はじめる</button>
        </div>
    </div>

    <!-- ホーム -->
    <div id="home-page" class="page">
        <header>ホーム</header>
        <div class="profile-area">
            <div id="homeIconArea" style="cursor:pointer;">
                <div class="icon-preview" id="homeIconPreview">画</div>
                <input type="file" id="homeIconInput" accept="image/*" style="display:none;">
            </div>
            <div style="font-size: 18px; font-weight:bold; margin-top:10px;" id="displayMyName"></div>
            <div style="font-size: 14px; color: #666; margin-top: 5px;">ID: <span id="displayMyId" style="color:#06C755; font-weight:bold;"></span></div>
        </div>

        <div class="settings-area">
            <div style="display:flex; gap:8px;">
                <input type="text" id="friendIdInput" placeholder="IDで友達を検索" style="flex:1; padding:8px;" maxlength="6">
                <button id="addFriendBtn" style="padding:8px 12px; background:#1a73e8; color:white; border:none; border-radius:8px;">追加</button>
            </div>
            <div class="action-btns">
                <button onclick="showQrModal()">マイQR表示</button>
                <button onclick="openQrScanner()">QRカメラ</button>
                <button onclick="showGroupModal()">グループ作成</button>
            </div>
        </div>

        <div style="padding: 10px 15px; font-size: 13px; font-weight: bold; color: #666; background: #f5f5f5;">トークリスト (長押しで削除)</div>
        <ul class="list-container" id="chatList"></ul>
    </div>

    <!-- トーク画面 -->
    <div id="chat-page" class="page">
        <header>
            <button class="back-btn" id="backBtn">＜</button>
            <span id="chatTargetName">名前</span>
        </header>
        <div id="chat-area"></div>
        <div id="input-area">
            <label class="photo-btn">📷<input type="file" id="photoInput" accept="image/*" style="display:none;"></label>
            <input type="text" id="messageInput" placeholder="メッセージ...">
            <button id="submitBtn"><div class="send-icon"></div></button>
        </div>
    </div>

    <!-- モーダル -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <h3>あなたのQRコード</h3>
            <canvas id="myQrCanvas"></canvas>
            <p style="font-size:12px; color:#666;">友達に読み取ってもらおう</p>
            <button onclick="document.getElementById('qrModal').style.display='none'" style="padding:10px 20px; margin-top:10px; background:#ccc; border:none; border-radius:5px;">閉じる</button>
        </div>
    </div>
    <div id="qrScannerModal" class="modal">
        <div class="modal-content">
            <h3>QRコードをスキャン</h3>
            <div id="loadingMessage" style="margin-bottom: 10px; font-size: 14px; color: #666;">🎥 カメラの許可を待っています...</div>
            <canvas id="qrCanvas" hidden></canvas>
            <button onclick="closeQrScanner()" style="padding:10px 20px; margin-top:15px; background:#ccc; border:none; border-radius:5px;">キャンセル</button>
        </div>
    </div>
    <div id="groupModal" class="modal">
        <div class="modal-content">
            <h3>グループ作成</h3>
            <input type="text" id="groupNameInput" placeholder="グループ名" style="width:100%; padding:10px; margin-bottom:15px;">
            <div style="text-align:left; font-size:13px; font-weight:bold; margin-bottom:5px;">メンバー選択</div>
            <div id="groupMemberSelect" style="max-height:150px; overflow-y:auto; text-align:left; border:1px solid #ccc; padding:10px; margin-bottom:15px; border-radius:5px;"></div>
            <div style="display:flex; justify-content:space-between;">
                <button onclick="document.getElementById('groupModal').style.display='none'" style="padding:10px; background:#ccc; border:none; border-radius:5px;">キャンセル</button>
                <button id="createGroupBtn" style="padding:10px; background:#06C755; color:white; border:none; border-radius:5px;">作成する</button>
            </div>
        </div>
    </div>
    <div id="imageViewerModal" class="modal" onclick="this.style.display='none'">
        <img id="viewerImage" src="" style="max-width: 95%; max-height: 95%; border-radius: 8px; object-fit: contain;">
    </div>


    <script>
        // ★ここに 発行した新しいURL を貼り付けてください！
        const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbxdNWrcK7QQJ3nCJZeer5fJt54ZhOA3PDeuhn3Uw86AIwF2RfZDUBIZMPBZk2T6_7jzeA/exec";

        const pages = { login: document.getElementById('login-page'), home: document.getElementById('home-page'), chat: document.getElementById('chat-page') };
        const chatArea = document.getElementById('chat-area'), chatList = document.getElementById('chatList');
        
        let myId = localStorage.getItem('line_my_id') || '';
        let myName = localStorage.getItem('line_my_name') || '';
        let myIconBase64 = localStorage.getItem('line_my_icon') || ''; 
        let friends = [];
        try { friends = JSON.parse(localStorage.getItem('line_friends_v5')) || []; if (!Array.isArray(friends)) friends = []; } catch(e) { friends = []; }
        
        let groups = [];
        let currentRoomId = '';
        let currentTarget = null;
        let autoReloadInterval = null;
        let homePollingInterval = null;

        async function apiGet(params) {
            const url = new URL(ENDPOINT_URL);
            for (let key in params) url.searchParams.append(key, params[key]);
            const res = await fetch(url);
            return await res.json();
        }

        async function apiPost(params) {
            const form = new URLSearchParams();
            for (let key in params) form.append(key, params[key]);
            await fetch(ENDPOINT_URL, { method: 'POST', body: form, mode: 'no-cors' });
            return { status: "success" };
        }

        function processImage(file, maxSize, callback) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width, h = img.height;
                    if (w > maxSize || h > maxSize) {
                        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; } 
                        else { w = Math.round(w * maxSize / h); h = maxSize; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    let quality = 0.8;
                    let dataUrl = canvas.toDataURL('image/jpeg', quality);
                    while(dataUrl.length > 45000 && quality > 0.1) { quality -= 0.1; dataUrl = canvas.toDataURL('image/jpeg', quality); }
                    if (dataUrl.length > 45000) {
                        const smallCanvas = document.createElement('canvas');
                        smallCanvas.width = w / 2; smallCanvas.height = h / 2;
                        smallCanvas.getContext('2d').drawImage(canvas, 0, 0, smallCanvas.width, smallCanvas.height);
                        dataUrl = smallCanvas.toDataURL('image/jpeg', 0.5);
                    }
                    callback(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.openImageViewer = function(src) {
            document.getElementById('viewerImage').src = src;
            document.getElementById('imageViewerModal').style.display = 'flex';
        };

        document.getElementById('regIconArea').onclick = () => document.getElementById('regIconInput').click();
        document.getElementById('regIconInput').onchange = (e) => processImage(e.target.files[0], 150, data => {
            myIconBase64 = data; document.getElementById('regIconPreview').innerHTML = `<img src="${data}">`;
        });

        document.getElementById('homeIconArea').onclick = () => document.getElementById('homeIconInput').click();
        document.getElementById('homeIconInput').onchange = (e) => processImage(e.target.files[0], 150, async data => {
            myIconBase64 = data; 
            document.getElementById('homeIconPreview').innerHTML = `<img src="${data}">`;
            localStorage.setItem('line_my_icon', data);
            try { await apiPost({ action: 'update_profile', id: myId, name: myName, icon: data }); } catch(err) {}
        });

        if (myId && myName) { pages.login.classList.remove('active'); pages.home.classList.add('active'); initHome(); }

        document.getElementById('registerBtn').onclick = async () => {
            const name = document.getElementById('regNameInput').value.trim();
            if (name === '') return alert('名前を入力してください');
            const newId = Math.random().toString(36).substring(2, 8).toUpperCase(); 
            document.getElementById('registerBtn').textContent = '登録中...';
            try {
                await apiPost({ action: 'update_profile', id: newId, name: name, icon: myIconBase64 });
                localStorage.setItem('line_my_id', newId); localStorage.setItem('line_my_name', name);
                if(myIconBase64) localStorage.setItem('line_my_icon', myIconBase64);
                myId = newId; myName = name;
                pages.login.classList.remove('active'); pages.home.classList.add('active');
                initHome();
            } catch (e) { alert('エラーが発生しました'); }
        };

        // ホーム画面：自分宛てのメッセージをくれた人を自動でリストに追加する
        async function fetchChatList() {
            try {
                const res = await apiGet({ action: 'get_chat_list', userId: myId });
                if (res.groups) groups = res.groups;
                
                if (res.chatUsers) {
                    let added = false;
                    res.chatUsers.forEach(uid => {
                        if (!friends.some(f => f.id === uid) && uid !== myId) {
                            friends.unshift({ id: uid, name: `新着メッセージ! (ID:${uid})`, icon: '' });
                            added = true;
                        }
                    });
                    if (added) {
                        localStorage.setItem('line_friends_v5', JSON.stringify(friends));
                        renderChatList();
                    }
                }
                renderChatList();
            } catch(e) {}
        }

        async function initHome() {
            document.getElementById('displayMyName').textContent = myName;
            document.getElementById('displayMyId').textContent = myId;
            if (myIconBase64) document.getElementById('homeIconPreview').innerHTML = `<img src="${myIconBase64}">`;
            
            renderChatList();
            await fetchChatList();

            if (homePollingInterval) clearInterval(homePollingInterval);
            homePollingInterval = setInterval(fetchChatList, 10000);
        }

        function renderChatList() {
            chatList.innerHTML = '';
            const allItems = [...friends, ...groups];
            allItems.forEach(item => {
                const li = document.createElement('li'); li.className = 'list-item';
                const iconHtml = item.icon ? `<img src="${item.icon}">` : (item.name && item.name.charAt(0) !== '新' ? item.name.charAt(0) : '？');
                
                let nameHtml = item.name;
                if (item.name.includes('未登録') || item.name.includes('確認中') || item.name.includes('新着')) {
                    nameHtml = `<span style="color:#e91e63; font-weight:bold;">${item.name}</span>`;
                }

                li.innerHTML = `<div class="list-item-icon">${iconHtml}</div><div class="list-item-name">${nameHtml} ${item.isGroup ? '(グループ)' : ''}</div>`;
                
                let pressTimer;
                let isLongPress = false;
                const startPress = (e) => {
                    isLongPress = false;
                    pressTimer = setTimeout(() => {
                        isLongPress = true;
                        if(navigator.vibrate) navigator.vibrate(50);
                        if (item.isGroup) {
                            alert("グループの削除は現在対応していません。");
                        } else {
                            if (confirm(`「${item.name}」をリストから削除しますか？`)) {
                                friends = friends.filter(f => f.id !== item.id);
                                localStorage.setItem('line_friends_v5', JSON.stringify(friends));
                                renderChatList();
                            }
                        }
                    }, 600);
                };

                const cancelPress = () => clearTimeout(pressTimer);
                const executeClick = (e) => {
                    if (isLongPress) { e.preventDefault(); return; }
                    openChatRoom(item);
                };

                li.addEventListener('mousedown', startPress);
                li.addEventListener('touchstart', startPress, {passive: true});
                li.addEventListener('mouseup', cancelPress);
                li.addEventListener('mouseleave', cancelPress);
                li.addEventListener('touchend', cancelPress);
                li.addEventListener('touchmove', cancelPress, {passive: true});
                li.addEventListener('contextmenu', (e) => { e.preventDefault(); cancelPress(); });
                li.addEventListener('click', executeClick);

                chatList.appendChild(li);
            });
        }

        function addFriendLocally(targetId, isAuto = false) {
            targetId = targetId.trim().toUpperCase();
            if (targetId === '' || targetId.length !== 6) return;
            if (targetId === myId) { if (!isAuto) alert('自分のIDです。'); return; }
            if (friends.some(f => f.id === targetId)) { if (!isAuto) alert('すでに追加されています。'); return; }

            friends.push({ id: targetId, name: `確認中... (ID:${targetId})`, icon: '' });
            localStorage.setItem('line_friends_v5', JSON.stringify(friends));
            
            document.getElementById('friendIdInput').value = '';
            renderChatList(); 
        }
        
        const friendIdInput = document.getElementById('friendIdInput');
        document.getElementById('addFriendBtn').onclick = () => addFriendLocally(friendIdInput.value, false);
        friendIdInput.addEventListener('input', (e) => {
            const val = e.target.value.trim().toUpperCase();
            if (val.length === 6) addFriendLocally(val, true);
        });

        function showQrModal() { document.getElementById('qrModal').style.display = 'flex'; new QRious({ element: document.getElementById('myQrCanvas'), value: myId, size: 200 }); }

        const qrScannerModal = document.getElementById('qrScannerModal');
        const qrCanvasElement = document.getElementById('qrCanvas');
        const qrCanvas = qrCanvasElement.getContext("2d", { willReadFrequently: true });
        const loadingMessage = document.getElementById('loadingMessage');
        let video = document.createElement("video");
        let scanning = false;
        let stream = null;

        function openQrScanner() {
            qrScannerModal.style.display = 'flex'; scanning = true; qrCanvasElement.hidden = true; loadingMessage.hidden = false;
            loadingMessage.innerText = "🎥 カメラの許可を待っています...";
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function(s) {
                stream = s; video.srcObject = stream; video.setAttribute("playsinline", true); video.play(); requestAnimationFrame(tick);
            }).catch(function(err) {
                loadingMessage.innerText = "カメラにアクセスできませんでした。\nブラウザの許可を確認してください。"; scanning = false;
            });
        }
        function closeQrScanner() { scanning = false; qrScannerModal.style.display = 'none'; if(stream) stream.getTracks().forEach(track => track.stop()); }
        function tick() {
            if (!scanning) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                loadingMessage.hidden = true; qrCanvasElement.hidden = false;
                qrCanvasElement.height = video.videoHeight; qrCanvasElement.width = video.videoWidth;
                qrCanvas.drawImage(video, 0, 0, qrCanvasElement.width, qrCanvasElement.height);
                var imageData = qrCanvas.getImageData(0, 0, qrCanvasElement.width, qrCanvasElement.height);
                var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                if (code && code.data) { closeQrScanner(); addFriendLocally(code.data, false); return; }
            }
            requestAnimationFrame(tick);
        }

        function showGroupModal() {
            document.getElementById('groupModal').style.display = 'flex';
            const selectDiv = document.getElementById('groupMemberSelect');
            selectDiv.innerHTML = '';
            friends.forEach(f => { selectDiv.innerHTML += `<label style="display:block; margin:5px 0;"><input type="checkbox" value="${f.id}"> ${f.name}</label>`; });
        }
        document.getElementById('createGroupBtn').onclick = async () => {
            const gName = document.getElementById('groupNameInput').value.trim();
            if (gName === '') return alert('グループ名を入力してください');
            const checkboxes = document.querySelectorAll('#groupMemberSelect input:checked');
            if (checkboxes.length === 0) return alert('メンバーを選択してください');
            const memberIds = Array.from(checkboxes).map(cb => cb.value); memberIds.push(myId);
            const gId = "G_" + Math.random().toString(36).substring(2, 10).toUpperCase();
            document.getElementById('createGroupBtn').textContent = '作成中...';
            await apiPost({ action: 'create_group', groupId: gId, groupName: gName, members: memberIds.join(',') });
            alert('グループを作成しました！');
            document.getElementById('groupModal').style.display = 'none'; document.getElementById('createGroupBtn').textContent = '作成する';
            initHome(); 
        };

        function openChatRoom(item) {
            currentTarget = item;
            currentRoomId = item.isGroup ? item.id : [myId, item.id].sort().join('_');
            document.getElementById('chatTargetName').textContent = (item.name.includes('未登録') || item.name.includes('確認中') || item.name.includes('新着')) ? `ID: ${item.id}` : item.name;
            pages.home.classList.remove('active'); pages.chat.classList.add('active');
            chatArea.innerHTML = '<div style="text-align:center; color:white; margin-top:10px;">読み込み中...</div>';
            
            if (homePollingInterval) clearInterval(homePollingInterval);

            loadPosts();
            autoReloadInterval = setInterval(() => loadPosts(true), 10000);
        }

        document.getElementById('backBtn').onclick = () => {
            clearInterval(autoReloadInterval);
            pages.chat.classList.remove('active'); pages.home.classList.add('active');
            initHome(); 
        };

        function createMessageElement(post, isTemp = false, isRead = false) {
            const isMine = (post.senderId === myId);
            const rowDiv = document.createElement('div');
            rowDiv.className = `message-row ${isMine ? 'mine' : 'other'}`;
            if (isTemp) rowDiv.style.opacity = '0.6'; 

            let timeText = post.date.length > 5 ? post.date.slice(-5) : post.date;
            let avatarHtml = '';
            if (!isMine) {
                let iconHtml = post.name ? post.name.charAt(0) : '？';
                let f = friends.find(x => x.id === post.senderId);
                if (f && f.icon) { iconHtml = `<img src="${f.icon}">`; } 
                else if (currentTarget && !currentTarget.isGroup && currentTarget.icon) { iconHtml = `<img src="${currentTarget.icon}">`; }
                avatarHtml = `<div class="avatar-area"><div class="avatar">${iconHtml}</div></div>`;
            }

            let nameAbove = (!isMine && currentTarget && currentTarget.isGroup) ? `<div style="font-size:11px; color:#e5e5e5; margin-bottom:3px; margin-left:4px;">${post.name}</div>` : '';
            let bubbleContent = post.message;
            if (bubbleContent.startsWith('[IMAGE]')) {
                const base64Data = bubbleContent.replace('[IMAGE]', '');
                bubbleContent = `<img src="${base64Data}" onclick="openImageViewer(this.src)">`;
            }

            let readHtml = (isMine && isRead) ? `<div style="font-size:10px; color:#e5e5e5; margin-bottom:2px; text-align:right;">既読</div>` : '';
            const timeBlock = `<div style="display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end; margin:0 5px;">
                                  ${isMine ? readHtml : ''}
                                  <div class="time" style="margin:0; align-self:flex-end;">${timeText}</div>
                               </div>`;

            rowDiv.innerHTML = `
                ${!isMine ? avatarHtml : ''}
                <div class="message-content">
                    ${nameAbove}
                    <div class="bubble">${bubbleContent}</div>
                </div>
                ${isMine ? timeBlock : `<div class="time" style="align-self:flex-end; margin:0 5px;">${timeText}</div>`}
            `;
            return rowDiv;
        }

        // ★最強の解決策：メッセージを読み込んだ瞬間、相手が送ってきた本当の名前をダイレクトに学習して反映する
        async function loadPosts(isAutoReload = false) {
            try {
                const posts = await apiGet({ action: 'get_messages', room: currentRoomId, userId: myId });
                const isAtBottom = (chatArea.scrollTop + chatArea.clientHeight >= chatArea.scrollHeight - 50);
                chatArea.innerHTML = ''; 
                
                let lastOtherIndex = -1;
                for (let i = posts.length - 1; i >= 0; i--) {
                    if (posts[i].senderId !== myId) { lastOtherIndex = i; break; }
                }
                
                posts.forEach((post, index) => {
                    const isRead = post.read || (post.senderId === myId && index < lastOtherIndex);
                    chatArea.appendChild(createMessageElement(post, false, isRead));

                    // ★ここに到達した瞬間（メッセージを受信/確認した瞬間）、友達リストの名前を相手の本名に自動書き換え！
                    if (post.senderId !== myId && currentTarget && !currentTarget.isGroup && post.senderId === currentTarget.id) {
                        let idx = friends.findIndex(f => f.id === post.senderId);
                        if (idx >= 0 && friends[idx].name !== post.name) {
                            friends[idx].name = post.name;
                            localStorage.setItem('line_friends_v5', JSON.stringify(friends));
                            document.getElementById('chatTargetName').textContent = post.name;
                            renderChatList();
                        }
                    }
                });

                if (!isAutoReload || isAtBottom) chatArea.scrollTop = chatArea.scrollHeight;
            } catch (e) {}
        }

        document.getElementById('submitBtn').onclick = async () => {
            const msg = document.getElementById('messageInput').value.trim();
            if (msg === '') return;
            
            const now = new Date();
            const timeText = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            const tempPost = { senderId: myId, name: myName, message: msg, date: timeText };
            chatArea.appendChild(createMessageElement(tempPost, true, false));
            chatArea.scrollTop = chatArea.scrollHeight;
            
            document.getElementById('messageInput').value = '';
            document.getElementById('submitBtn').disabled = true;
            
            try { await apiPost({ action: 'send_message', senderId: myId, name: myName, message: msg, room: currentRoomId }); } catch(e) {}
            await loadPosts();
            chatArea.scrollTop = chatArea.scrollHeight;
            document.getElementById('submitBtn').disabled = false;
        };

        document.getElementById('photoInput').onchange = (e) => {
            processImage(e.target.files[0], 800, async (base64Data) => {
                const now = new Date();
                const timeText = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
                const tempPost = { senderId: myId, name: myName, message: "[IMAGE]" + base64Data, date: timeText };
                chatArea.appendChild(createMessageElement(tempPost, true, false));
                chatArea.scrollTop = chatArea.scrollHeight;

                try { await apiPost({ action: 'send_message', senderId: myId, name: myName, message: "[IMAGE]" + base64Data, room: currentRoomId }); } catch(e) {}
                await loadPosts();
                chatArea.scrollTop = chatArea.scrollHeight;
            });
            e.target.value = '';
        };
    </script>
</body>
</html>
